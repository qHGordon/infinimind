<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#4F46E5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="无界思维 InfiniMind — 无边际画布 × XMind 式思维导图 × 流程图/泳道工作流。树形文本一键成图、文本框、图片、任务清单、手写批注、跨对象连线、放大镜聚焦。">
<title>无界思维 InfiniMind · 无边际画布 × 思维导图</title>
<style>
/* ============================================================
   无界思维 InfiniMind — 单文件应用
   无边际画布(Freeform 体感) × 思维导图(XMind 体感)
   ============================================================ */
:root{
  --bg:#F7F8FB;
  --ink:#1E293B;
  --ink2:#475569;
  --ink3:#94A3B8;
  --brand:#4F46E5;
  --brand-soft:#EEF2FF;
  --line:#E6EAF2;
  --card:#FFFFFF;
  --shadow:0 10px 30px rgba(15,23,42,.10), 0 2px 8px rgba(15,23,42,.06);
  --shadow-sm:0 1px 2px rgba(15,23,42,.07), 0 2px 8px rgba(15,23,42,.05);
  --radius:14px;
  --f:ui-sans-serif,-apple-system,BlinkMacSystemFont,"SF Pro SC","PingFang SC","Segoe UI","Microsoft YaHei",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"PingFang SC",monospace;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{width:100%;height:100%;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--f);color:var(--ink);background:var(--bg)}
button{font-family:var(--f)}

/* ---------- 画布 ---------- */
#stage{
  position:fixed;inset:0;overflow:hidden;touch-action:none;cursor:default;
  background-color:var(--bg);
  background-image:radial-gradient(circle,#D8DEE9 1.1px,transparent 1.4px);
  user-select:none;-webkit-user-select:none;
}
#stage.hand{cursor:grab} #stage.panning{cursor:grabbing}
#stage.connect{cursor:crosshair} #stage.lens{cursor:crosshair}
#world{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;will-change:transform}
#wires{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#inkLayer{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
#wires .fe-hit{pointer-events:stroke;cursor:pointer}
#itemLayer,#laneLayer{position:absolute;left:0;top:0}
#emptyHint{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;color:var(--ink3);pointer-events:none;display:none;line-height:2;font-size:14px}
#emptyHint b{color:var(--ink2);font-weight:600}
#marquee{position:fixed;border:1.5px solid var(--brand);background:rgba(79,70,229,.08);border-radius:4px;display:none;pointer-events:none;z-index:30}

/* ---------- 导图节点 ---------- */
.node{
  position:absolute;width:max-content;max-width:320px;border-radius:9px;
  padding:7px 13px;font-size:13px;line-height:1.5;box-shadow:var(--shadow-sm);
  cursor:default;will-change:transform;
}
.node .txt{display:block;white-space:pre-wrap;word-break:break-word;outline:none;min-width:8px;min-height:1em}
.node.d0{border-radius:11px;padding:10px 18px}
.node.editing{cursor:text;box-shadow:0 0 0 2px var(--brand),0 8px 20px rgba(79,70,229,.25)}
.node.editing .txt{user-select:text;-webkit-user-select:text;cursor:text}
.node.lifting{opacity:.82;box-shadow:0 16px 40px rgba(15,23,42,.25);z-index:5}
.node.drop-target{box-shadow:0 0 0 3px #F59E0B,var(--shadow-sm)}
.item-sel{outline:2px solid var(--brand);outline-offset:2.5px}
.toggle{
  position:absolute;right:-11px;top:50%;transform:translateY(-50%);
  min-width:20px;height:20px;padding:0 4px;border-radius:10px;border:1.5px solid var(--ink3);
  background:#fff;color:var(--ink2);font-size:11px;font-weight:600;line-height:1;
  display:none;align-items:center;justify-content:center;cursor:pointer;z-index:3;
}
.node:hover .toggle{display:inline-flex}
.toggle.collapsed{display:inline-flex;background:var(--ink);color:#fff;border-color:var(--ink)}

/* ---------- 文本框 ---------- */
.note{
  position:absolute;border-radius:11px;background:#fff;border:1px solid var(--line);
  box-shadow:var(--shadow-sm);padding:13px 15px;font-size:14.5px;line-height:1.65;color:#334155;
  cursor:default;will-change:transform;
}
.note .txt{display:block;white-space:pre-wrap;word-break:break-word;outline:none;min-height:1.2em}
.note.transparent{background:transparent;border-color:transparent;box-shadow:none}
.note.editing{box-shadow:0 0 0 2px var(--brand),0 8px 20px rgba(79,70,229,.2)}
.note.editing .txt{user-select:text;-webkit-user-select:text;cursor:text}
.note .ph{color:var(--ink3)}
.rz{position:absolute;right:-6px;top:0;bottom:0;width:12px;cursor:ew-resize;opacity:0}
.rz::after{content:"";position:absolute;right:4px;top:50%;transform:translateY(-50%);width:4px;height:26px;border-radius:2px;background:var(--brand)}
.note:hover .rz,.note.item-sel .rz{opacity:.85}

/* ---------- 图片 ---------- */
.pic{position:absolute;border-radius:10px;border:1px solid var(--line);box-shadow:var(--shadow-sm);background:#fff;padding:3px;cursor:default;will-change:transform}
.pic img{display:block;width:100%;height:100%;border-radius:7px;pointer-events:none}
.rzc{position:absolute;right:-8px;bottom:-8px;width:16px;height:16px;border-radius:50%;background:#fff;border:2px solid var(--brand);cursor:nwse-resize;opacity:0}
.pic:hover .rzc,.pic.item-sel .rzc{opacity:1}

/* ---------- 顶部工具栏 ---------- */
#topbar{
  position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:40;
  display:flex;align-items:center;gap:2px;padding:6px 8px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  max-width:calc(100vw - 20px);overflow-x:auto;scrollbar-width:none;
}
#topbar::-webkit-scrollbar{display:none}
#logo{display:flex;align-items:center;gap:8px;padding:0 10px 0 4px;white-space:nowrap}
#logoMark{width:24px;height:24px;border-radius:7px;background:linear-gradient(135deg,#6366F1,#8B5CF6);display:grid;place-items:center;flex:0 0 auto}
#logoMark svg{width:14px;height:14px;stroke:#fff;stroke-width:2}
#logoName{font-size:13.5px;font-weight:700;letter-spacing:.2px}
#logoName small{display:block;font-size:9px;font-weight:500;color:var(--ink3);letter-spacing:.6px;margin-top:-1px}
.sep{width:1px;height:22px;background:var(--line);margin:0 6px;flex:0 0 auto}
.tb{
  position:relative;width:36px;height:36px;border:0;border-radius:9px;background:transparent;
  display:grid;place-items:center;color:var(--ink2);cursor:pointer;flex:0 0 auto;
}
.tb:hover{background:#F1F5F9}
.tb.on{background:var(--brand-soft);color:var(--brand)}
.tb svg{width:19px;height:19px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tb .kbd{position:absolute;right:3px;bottom:2px;font-size:8px;color:var(--ink3);font-weight:600}
.tb.on .kbd{color:var(--brand)}
.tb:disabled{opacity:.35;cursor:default}
.tb:disabled:hover{background:transparent}

/* ---------- 底部控制 ---------- */
#zoombar{
  position:fixed;left:16px;bottom:16px;z-index:40;display:flex;align-items:center;gap:2px;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border:1px solid var(--line);
  border-radius:11px;box-shadow:var(--shadow-sm);padding:4px;
}
#zoombar .tb{width:30px;height:30px}
#zPct{min-width:48px;text-align:center;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;border-radius:7px;padding:6px 2px;border:0;background:transparent}
#zPct:hover{background:#F1F5F9}

/* ---------- 流程块（方案 A） ---------- */
.shape{position:absolute;cursor:default;will-change:transform}
.shape svg.shp{position:absolute;left:0;top:0;width:100%;height:100%;overflow:visible;pointer-events:none}
.shape .txt{
  position:relative;display:flex;align-items:center;justify-content:center;text-align:center;
  width:100%;height:100%;font-size:13px;font-weight:600;line-height:1.4;outline:none;
  word-break:break-word;white-space:pre-wrap;
}
.shape.editing{filter:drop-shadow(0 0 0 var(--brand)) drop-shadow(0 0 3px var(--brand))}
.shape.editing .txt{user-select:text;-webkit-user-select:text;cursor:text}
.shape .rz{right:-7px}
.shape:hover .rz,.shape.item-sel .rz{opacity:.85}
.shape.item-sel{outline:none;filter:drop-shadow(0 0 0 var(--brand)) drop-shadow(0 0 2.5px var(--brand))}

/* ---------- 泳道（方案 C） ---------- */
.lane{position:absolute;border-radius:12px;background:#FBFCFE;border:1px solid #E3E8F2;box-shadow:var(--shadow-sm);cursor:default;will-change:transform;overflow:hidden}
.lane .ln-title{font-size:13.5px;font-weight:700;color:#16233B;padding:9px 13px 7px;outline:none}
.lane .ln-colhd{display:flex;border-top:1px solid #E9EDF6;background:#F4F7FC}
.lane .ln-colhd>div{flex:1;min-width:0;padding:6px 8px;font-size:11.5px;font-weight:700;color:#64748B;text-align:center;border-left:1px solid #E9EDF6;outline:none}
.lane .ln-colhd>div:first-child{border-left:0}
.lane .ln-row{display:flex;border-top:1px solid #E9EDF6;position:relative}
.lane .ln-name{
  flex:0 0 auto;display:flex;align-items:center;justify-content:center;text-align:center;
  font-size:11.5px;font-weight:700;color:#5A6880;background:#F4F7FC;padding:4px 6px;outline:none;
  border-right:1px solid #E9EDF6;word-break:break-word;
}
.lane .ln-cells{flex:1;display:flex;min-width:0}
.lane .ln-cells>div{flex:1;border-left:1px dashed #EDF1F8}
.lane .ln-cells>div:first-child{border-left:0}
.lane.item-sel{outline:2px solid var(--brand);outline-offset:2.5px}
.lane .rz{opacity:0}
.lane:hover .rz,.lane.item-sel .rz{opacity:.85}
.lane .lnz{position:absolute;left:0;right:0;bottom:-5px;height:10px;cursor:ns-resize;opacity:0}
.lane .lnz::after{content:"";position:absolute;left:50%;transform:translateX(-50%);bottom:4px;width:30px;height:4px;border-radius:2px;background:var(--brand)}
.lane:hover .lnz,.lane.item-sel .lnz{opacity:.85}

/* ---------- 链接 ---------- */
a.lnk{color:var(--brand);text-decoration:underline;text-underline-offset:2px;cursor:pointer;word-break:break-all;-webkit-user-drag:none;user-drag:none}
a.lnk:hover{color:#4338CA;background:rgba(79,70,229,.09);border-radius:3px}
.note.linkcard{border-color:#D3E1FA;padding:11px 13px;cursor:pointer}
.note.linkcard.linkblue{background:#EFF5FF}
.note.linkcard:hover{border-color:#7C9CF5;box-shadow:0 5px 16px rgba(59,110,229,.18)}
.note.linkcard .lnk-ico{background:#DCE9FE;color:#2563EB}
a.lnkcard{display:flex;align-items:center;gap:10px;text-decoration:none;color:inherit;font-size:13.5px;line-height:1.45;min-width:0}
a.lnkcard:hover{background:transparent}
.lnk-ico{flex:0 0 auto;width:28px;height:28px;border-radius:8px;background:var(--brand-soft);display:grid;place-items:center;color:var(--brand)}
.lnk-ico svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round}
.lnk-body{flex:1;min-width:0;overflow:hidden}
.lnk-host{color:var(--ink);font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block}
.lnk-path{color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;font-size:11.5px;margin-top:1px}
.lnk-go{flex:0 0 auto;color:var(--ink3);font-size:14px;font-weight:600}
a.lnkcard:hover .lnk-go{color:var(--brand)}

/* ---------- 任务清单 ---------- */
.todo{
  position:absolute;border-radius:13px;background:#fff;border:1px solid var(--line);
  box-shadow:var(--shadow-sm);padding:14px 16px 8px;cursor:default;will-change:transform;
}
.todo .td-f,.todo .td-title{outline:none;word-break:break-word}
.todo .td-row{position:relative}
.todo .td-cb{cursor:pointer}
.todo .td-tag{cursor:pointer;user-select:none}
.todo .td-grip{
  position:absolute;left:-13px;top:11px;width:12px;height:16px;opacity:0;cursor:grab;
  display:grid;place-items:center;color:var(--ink3);font-size:11px;line-height:1;
}
.todo .td-row:hover .td-grip{opacity:.75}
.todo .td-add{cursor:pointer}
.todo .td-adddesc{
  display:inline-block;margin-top:3px;font-size:11.5px;color:#9AA5B6;cursor:text;
  opacity:0;transition:opacity .12s;user-select:none;padding:1px 5px;margin-left:-5px;border-radius:5px;
}
.todo .td-adddesc:hover{background:#F1F5F9;color:var(--brand)}
.todo .td-row:hover .td-adddesc{opacity:1}
.todo .td-row:has(.editing-f) .td-adddesc{opacity:1}
.todo .td-link{
  position:absolute;right:-12px;top:50%;transform:translateY(-50%);
  width:15px;height:15px;border-radius:50%;background:#fff;border:2px solid var(--brand);
  opacity:0;cursor:crosshair;z-index:6;box-shadow:0 1px 3px rgba(15,23,42,.2);
}
.todo .td-link::after{content:"";position:absolute;inset:3px;border-radius:50%;background:var(--brand)}
.todo .td-row:hover .td-link{opacity:1}
.todo .td-link:hover{transform:translateY(-50%) scale(1.25)}
.todo .td-row.row-link{background:rgba(79,70,229,.09);border-radius:7px}
.todo .td-row.row-target{box-shadow:0 0 0 2px var(--brand);border-radius:7px}
.todo .rz{z-index:3}
#stage.connect .todo .td-row:hover{background:rgba(79,70,229,.07);border-radius:7px}
.todo .td-row.dragging{opacity:.45}
.todo .td-row.drop-above{box-shadow:inset 0 2px 0 var(--brand)}
.todo .td-row.drop-below{box-shadow:inset 0 -2px 0 var(--brand)}
.editing-f{
  user-select:text;-webkit-user-select:text;cursor:text;
  box-shadow:0 0 0 2px var(--brand);border-radius:5px;
  padding:1px 3px;margin:-1px -3px;background:#fff;
}
.todo.editing{box-shadow:0 0 0 2px var(--brand),0 8px 20px rgba(79,70,229,.2)}

/* ---------- 手写墨迹 ---------- */
#gInk path,#gDraw path{pointer-events:none}
#gInk path.hit{pointer-events:fill;cursor:default}
#gInk path.ink-sel{filter:drop-shadow(0 0 0 var(--brand)) drop-shadow(0 0 2.5px var(--brand))}
#stage.pen{cursor:crosshair}
#stage.eraser{cursor:cell}
#penbar{
  position:fixed;left:50%;transform:translateX(-50%);bottom:16px;z-index:44;display:none;
  align-items:center;gap:3px;padding:6px;background:rgba(255,255,255,.95);
  backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:13px;box-shadow:var(--shadow);
  max-width:calc(100vw - 24px);overflow-x:auto;scrollbar-width:none;
}
#penbar::-webkit-scrollbar{display:none}
#penbar.show{display:flex}
.pk{width:32px;height:32px;border:0;background:transparent;border-radius:9px;display:grid;place-items:center;cursor:pointer;color:var(--ink2);flex:0 0 auto}
.pk:hover{background:#F1F5F9}
.pk.on{background:var(--brand-soft);color:var(--brand)}
.pk svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.inkdot{width:22px;height:22px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(15,23,42,.16);cursor:pointer;flex:0 0 auto;margin:0 2px;padding:0}
.inkdot.on{box-shadow:0 0 0 2.5px var(--brand)}
.wdot{width:30px;height:30px;border:0;background:transparent;border-radius:8px;display:grid;place-items:center;cursor:pointer;flex:0 0 auto}
.wdot:hover{background:#F1F5F9}
.wdot i{display:block;border-radius:99px;background:var(--ink2)}
.wdot.on{background:var(--brand-soft)}
.wdot.on i{background:var(--brand)}
#penbar label{display:flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink2);white-space:nowrap;padding:0 6px;cursor:pointer;flex:0 0 auto}
#penbar label input{accent-color:var(--brand);width:14px;height:14px}
@media (max-width:760px){#penbar{bottom:112px}}

/* ---------- 画布分组（上排文件夹 + 下排画布，两行标签栏） ---------- */
#sheetdock{
  position:fixed;left:192px;bottom:16px;z-index:40;
  display:flex;flex-direction:column;align-items:flex-start;gap:6px;
  max-width:calc(100vw - 430px);
}
#folderbar,#sheetbar{
  display:flex;align-items:center;gap:2px;max-width:100%;
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border:1px solid var(--line);
  border-radius:11px;box-shadow:var(--shadow-sm);padding:4px;
  overflow-x:auto;scrollbar-width:none;
}
#folderbar{padding:3px 4px}
#folderbar::-webkit-scrollbar,#sheetbar::-webkit-scrollbar{display:none}
.fld{
  position:relative;display:flex;align-items:center;gap:5px;border:0;background:transparent;
  border-radius:8px;padding:5px 9px;font-size:12px;font-weight:600;color:var(--ink3);
  cursor:pointer;white-space:nowrap;flex:0 0 auto;font-family:var(--f);
}
.fld:hover{background:#F1F5F9;color:var(--ink2)}
.fld.on{background:#EEF2FF;color:var(--brand)}
.fld .nm{overflow:hidden;text-overflow:ellipsis;max-width:120px;display:inline-block}
.fld .cnt{font-size:10px;font-weight:700;opacity:.55;min-width:11px;text-align:center}
.fld .xd{
  display:none;width:14px;height:14px;border-radius:4px;line-height:1;font-size:10px;
  color:var(--ink3);align-items:center;justify-content:center;flex:0 0 auto;
}
.fld:hover .xd{display:inline-flex}
.fld .xd:hover{background:#E2E8F0;color:#DC2626}
.fld.drop{background:var(--brand-soft);color:var(--brand);box-shadow:inset 0 0 0 1.6px var(--brand)}
.fld input{border:1.5px solid var(--brand);border-radius:6px;font:600 12px var(--f);width:92px;padding:2px 6px;outline:none;color:var(--ink)}
.sht.dragging{opacity:.4}
.sht{
  position:relative;display:flex;align-items:center;gap:5px;border:0;background:transparent;
  border-radius:8px;padding:6px 10px;font-size:12.5px;font-weight:600;color:var(--ink2);
  cursor:pointer;white-space:nowrap;flex:0 0 auto;font-family:var(--f);
}
.sht:hover{background:#F1F5F9}
.sht.on{background:var(--brand-soft);color:var(--brand)}
.sht .nm{overflow:hidden;text-overflow:ellipsis;max-width:118px;display:inline-block}
.sht .xd{
  display:none;width:15px;height:15px;border-radius:4px;line-height:1;font-size:10.5px;
  color:var(--ink3);align-items:center;justify-content:center;flex:0 0 auto;
}
.sht:hover .xd{display:inline-flex}
.sht .xd:hover{background:#E2E8F0;color:#DC2626}
.sht input{border:1.5px solid var(--brand);border-radius:6px;font:600 12.5px var(--f);width:96px;padding:2px 6px;outline:none;color:var(--ink)}
#shAdd{width:27px;height:27px;border-radius:8px;border:0;background:transparent;color:var(--ink2);cursor:pointer;display:grid;place-items:center;flex:0 0 auto}
#shAdd:hover{background:#F1F5F9;color:var(--brand)}
@media (max-width:760px){#sheetdock{left:8px;bottom:64px;max-width:calc(100vw - 16px)}}
#minimapWrap{position:fixed;right:16px;bottom:16px;z-index:40;background:rgba(255,255,255,.92);backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow-sm);padding:5px;line-height:0}
#minimap{border-radius:7px;cursor:pointer}

/* ---------- 选中悬浮工具条 ---------- */
#ctxbar{
  position:fixed;z-index:45;display:none;align-items:center;gap:2px;padding:4px;
  background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);
  white-space:nowrap;
}
#ctxbar .tb{width:30px;height:30px;border-radius:7px}
#ctxbar .tb.txtbtn{width:auto;min-width:30px;padding:0 9px}
#ctxbar .tb svg{width:16px;height:16px}
.dot{width:17px;height:17px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(15,23,42,.14);cursor:pointer;flex:0 0 auto;margin:0 2.5px;padding:0}
.dot:hover{transform:scale(1.18)}
.dot.auto{background:repeating-linear-gradient(45deg,#E2E8F0 0 3px,#fff 3px 6px)}

/* ---------- 放大镜 ---------- */
#lens{
  position:fixed;z-index:60;display:none;border-radius:50%;
  box-shadow:0 24px 70px rgba(15,23,42,.4),0 0 0 3px var(--brand),0 0 0 8px rgba(79,70,229,.12);
  pointer-events:none;
}
#lens.pinned{box-shadow:0 24px 70px rgba(15,23,42,.4),0 0 0 3px #D97706,0 0 0 8px rgba(217,119,6,.15)}
#lensClip{position:absolute;inset:0;border-radius:50%;overflow:hidden;background:var(--bg);background-image:radial-gradient(circle,#D8DEE9 1.1px,transparent 1.4px);background-size:24px 24px}
#lensWorld{position:absolute;left:0;top:0;width:0;height:0;transform-origin:0 0;pointer-events:none}
#lensWorld *{pointer-events:none!important}
#lensHud{
  position:absolute;left:50%;top:-34px;transform:translateX(-50%);
  background:var(--ink);color:#fff;font-size:11px;font-weight:600;padding:4px 10px;border-radius:999px;
  white-space:nowrap;letter-spacing:.3px;
}
#lensBar{
  position:absolute;left:50%;bottom:-44px;transform:translateX(-50%);display:none;gap:4px;
  background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:4px;
  pointer-events:auto;
}
#lens.pinned #lensBar{display:flex}
#lensBar button{border:0;background:transparent;border-radius:7px;padding:6px 10px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap}
#lensBar button:hover{background:#F1F5F9}
#lensBar button.primary{color:var(--brand)}
#lensBar svg{width:13px;height:13px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

/* ---------- 弹层 / 菜单 / 对话框 ---------- */
#menu{position:fixed;z-index:70;display:none;min-width:172px;background:#fff;border:1px solid var(--line);border-radius:11px;box-shadow:var(--shadow);padding:5px}
#menu .mi{display:flex;align-items:center;gap:9px;width:100%;border:0;background:transparent;text-align:left;padding:8px 10px;border-radius:8px;font-size:13px;color:var(--ink);cursor:pointer}
#menu .mi:hover{background:#F4F6FA}
#menu .mi svg{width:15px;height:15px;fill:none;stroke:var(--ink2);stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
#menu .mi small{margin-left:auto;color:var(--ink3);font-size:11px}
#menu .msep{height:1px;background:var(--line);margin:4px 6px}
.overlay{position:fixed;inset:0;z-index:80;background:rgba(15,23,42,.38);display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.dlg{width:600px;max-width:100%;max-height:88vh;overflow:auto;background:#fff;border-radius:16px;box-shadow:0 30px 90px rgba(15,23,42,.35);padding:22px 24px}
.dlg h3{font-size:16px;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.dlg .sub{font-size:12.5px;color:var(--ink3);margin-bottom:14px;line-height:1.6}
.dlg textarea{
  width:100%;height:300px;resize:vertical;border:1.5px solid var(--line);border-radius:10px;
  font-family:var(--mono);font-size:12.5px;line-height:1.7;padding:12px;color:var(--ink);outline:none;background:#FBFCFE;
}
.dlg textarea:focus{border-color:var(--brand)}
.dlgBtns{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
.btn{border:0;border-radius:9px;padding:9px 18px;font-size:13.5px;font-weight:600;cursor:pointer;background:#F1F5F9;color:var(--ink2)}
.btn:hover{background:#E8EDF4}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:#4338CA}
.helpG{display:grid;grid-template-columns:1fr 1fr;gap:4px 26px;font-size:13px;margin:10px 0 2px}
.helpG div{display:flex;justify-content:space-between;gap:12px;padding:5.5px 0;border-bottom:1px dashed #EDF0F6;color:var(--ink2)}
.helpG b{font-weight:600;color:var(--ink)}
kbd{font-family:var(--mono);font-size:11px;background:#F1F5F9;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1.5px 6px;color:var(--ink2);white-space:nowrap}
@media (max-width:640px){.helpG{grid-template-columns:1fr}}

/* ---------- 其他 ---------- */
#toast{
  position:fixed;left:50%;bottom:76px;transform:translateX(-50%) translateY(8px);z-index:90;
  background:var(--ink);color:#fff;font-size:13px;padding:9px 18px;border-radius:999px;
  opacity:0;transition:all .25s;pointer-events:none;box-shadow:var(--shadow);max-width:86vw;text-align:center;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#labelInput{
  position:fixed;z-index:75;display:none;border:2px solid var(--brand);border-radius:8px;
  padding:5px 10px;font-size:12.5px;font-family:var(--f);outline:none;box-shadow:var(--shadow);
  background:#fff;color:var(--ink);width:160px;text-align:center;
}
.elabel{font-size:11.5px;font-weight:600;paint-order:stroke;stroke:#F7F8FB;stroke-width:4px;dominant-baseline:middle;text-anchor:middle}
/* ---------- 存储状态角标（右下角，小地图上方） ---------- */
#fsChip{
  position:fixed;right:16px;bottom:154px;z-index:40;display:flex;align-items:center;gap:7px;
  height:30px;padding:0 12px 0 10px;max-width:calc(100vw - 32px);
  background:rgba(255,255,255,.92);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow-sm);
  font:500 12px/1 var(--f);color:var(--ink2);cursor:pointer;user-select:none;white-space:nowrap;
}
#fsChip:hover{background:#fff;color:var(--ink)}
#fsChip i{width:7px;height:7px;border-radius:50%;background:var(--ink3);flex:0 0 auto}
#fsChip span{overflow:hidden;text-overflow:ellipsis}
#fsChip[data-s=saved] i{background:#16A34A}
#fsChip[data-s=dirty] i,#fsChip[data-s=saving] i,#fsChip[data-s=loading] i{background:#D97706}
#fsChip[data-s=saving] i,#fsChip[data-s=loading] i{animation:fsPulse 1s ease-in-out infinite}
#fsChip[data-s=unbound],#fsChip[data-s=perm],#fsChip[data-s=login],#fsChip[data-s=auth],#fsChip[data-s=pick],#fsChip[data-s=offline]{color:#B45309;border-color:#FCD34D;background:rgba(255,251,235,.96)}
#fsChip[data-s=unbound] i,#fsChip[data-s=perm] i,#fsChip[data-s=login] i,#fsChip[data-s=auth] i,#fsChip[data-s=pick] i,#fsChip[data-s=offline] i{background:#D97706}
#fsChip[data-s=err],#fsChip[data-s=missing]{color:#B91C1C;border-color:#FCA5A5;background:rgba(254,242,242,.96)}
#fsChip[data-s=err] i,#fsChip[data-s=missing] i{background:#DC2626}
@keyframes fsPulse{50%{opacity:.25}}
#dlgDrive .dlg{width:420px}
#dlgDrive .drvMark{width:40px;height:40px;border-radius:11px;background:linear-gradient(135deg,#6366F1,#8B5CF6);display:grid;place-items:center;margin-bottom:12px}
#dlgDrive .drvMark svg{width:22px;height:22px;stroke:#fff;stroke-width:2;fill:none}
@media (max-width:760px){
  #fsChip{bottom:16px}
  #logoName small{display:none}
  #minimapWrap{display:none}
  .tb .kbd{display:none}
}
</style>
</head>
<body>

<div id="stage">
  <div id="world">
    <div id="laneLayer"></div>
    <svg id="wires" xmlns="http://www.w3.org/2000/svg">
      <defs id="wireDefs"></defs>
      <g id="gTree"></g>
      <g id="gFree"></g>
      <g id="gTemp"></g>
    </svg>
    <div id="itemLayer"></div>
    <svg id="inkLayer" xmlns="http://www.w3.org/2000/svg">
      <g id="gInk"></g>
      <g id="gDraw"></g>
    </svg>
  </div>
</div>
<div id="emptyHint">
  <b>画布是空的</b><br>
  双击空白处新建主题 · <b>M</b> 插入思维导图 · <b>T</b> 文本框 · <b>I</b> 图片<br>
  滚轮平移 · <kbd>Ctrl/⌘</kbd>+滚轮缩放
</div>
<div id="marquee"></div>

<header id="topbar">
  <div id="logo">
    <div id="logoMark"><svg viewBox="0 0 24 24" fill="none"><circle cx="6" cy="12" r="2.6"/><circle cx="18" cy="6" r="2.4"/><circle cx="18" cy="18" r="2.4"/><path d="M8.4 11l7-4M8.4 13l7 4"/></svg></div>
    <div id="logoName">无界思维<small>INFINIMIND</small></div>
  </div>
  <div class="sep"></div>
  <button class="tb on" id="bV" title="选择 (V)"><svg viewBox="0 0 24 24"><path d="M5 3.5l14.5 6.2-6.4 2-2.6 6.1z"/></svg><span class="kbd">V</span></button>
  <button class="tb" id="bH" title="平移画布 (H / 空格 / 右键拖拽)"><svg viewBox="0 0 24 24"><path d="M8.5 12.5V6a1.4 1.4 0 0 1 2.8 0v5m0-5.6V4.2a1.4 1.4 0 0 1 2.8 0V11m0-5.4a1.4 1.4 0 0 1 2.8 0v7.9M8.5 12.3l-1.6-1.9a1.5 1.5 0 0 0-2.4 1.8l3.2 5.4A5 5 0 0 0 12 20h1.6a5 5 0 0 0 3.3-1.2"/></svg><span class="kbd">H</span></button>
  <div class="sep"></div>
  <button class="tb" id="bM" title="插入思维导图 (M) — 支持树形文本一键成图"><svg viewBox="0 0 24 24"><rect x="2.5" y="9.4" width="6.5" height="5.2" rx="1.4"/><rect x="15.5" y="3.4" width="6" height="4.6" rx="1.3"/><rect x="15.5" y="16" width="6" height="4.6" rx="1.3"/><path d="M9 12h2.6M11.6 12c2.6 0 1.6-6.3 3.9-6.3M11.6 12c2.6 0 1.6 6.3 3.9 6.3"/></svg><span class="kbd">M</span></button>
  <button class="tb" id="bT" title="文本框 (T) — 成段打字"><svg viewBox="0 0 24 24"><path d="M5.5 7V4.5h13V7M12 4.5v15M9 19.5h6"/></svg><span class="kbd">T</span></button>
  <button class="tb" id="bF" title="工作流 (W) — 流程块 / 泳道"><svg viewBox="0 0 24 24"><rect x="3" y="3.2" width="7.4" height="5.4" rx="1.4"/><rect x="13.6" y="15.4" width="7.4" height="5.4" rx="1.4"/><path d="M6.7 8.6v4.2a1.6 1.6 0 0 0 1.6 1.6h7.4M17.3 14.4l-1.8-1.8M17.3 14.4l-1.8 1.8" opacity="0"/><path d="M6.7 8.6v5.9a1.6 1.6 0 0 0 1.6 1.6h3.4"/><path d="M11 14.5l2.6 1.6-2.6 1.6" fill="currentColor" stroke="none" opacity=".9"/></svg><span class="kbd">W</span></button>
  <button class="tb" id="bI" title="插入图片 (I) — 也可直接粘贴/拖入"><svg viewBox="0 0 24 24"><rect x="3.5" y="4.5" width="17" height="15" rx="2.5"/><circle cx="9" cy="10" r="1.8"/><path d="M4.5 17.5l4.6-4.6a1.6 1.6 0 0 1 2.3 0l5.6 5.6M14.5 16l1.9-1.9a1.6 1.6 0 0 1 2.3 0l1.8 1.9"/></svg><span class="kbd">I</span></button>
  <button class="tb" id="bL" title="连接线 (L) — 依次点击两个对象建立关联"><svg viewBox="0 0 24 24"><circle cx="5.5" cy="6.5" r="2.6"/><circle cx="18.5" cy="17.5" r="2.6"/><path d="M7.8 8.2c3.4 2 4.8 5.4 8.4 7.4"/><path d="M13.4 15.1l3 .8.4-3.1"/></svg><span class="kbd">L</span></button>
  <button class="tb" id="bP" title="手写 / 绘图 (P) — 支持 Apple Pencil 压感"><svg viewBox="0 0 24 24"><path d="M4 20.2l1-4.1L15.6 5.5a2.3 2.3 0 0 1 3.2 3.2L8.1 19.3z"/><path d="M14.2 6.9l3.2 3.2M4 20.2l4.1-1.1"/></svg><span class="kbd">P</span></button>
  <button class="tb" id="bE" title="橡皮擦 (E) — 擦除笔迹"><svg viewBox="0 0 24 24"><path d="M8.6 19.5H20M4.6 15.2l6-6a2 2 0 0 1 2.8 0l4.3 4.3a2 2 0 0 1 0 2.8l-3.2 3.2H8.4l-3.8-3.8a1.8 1.8 0 0 1 0-2.5z"/><path d="M9.2 10.6l5.6 5.6"/></svg><span class="kbd">E</span></button>
  <button class="tb" id="bZ" title="放大镜聚焦 (Z) — 移动聚焦 · 单击固定 · 滚轮调倍率"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.7"/><path d="M15.6 15.6L21 21M7.7 10.5h5.6M10.5 7.7v5.6"/></svg><span class="kbd">Z</span></button>
  <div class="sep"></div>
  <button class="tb" id="bUndo" title="撤销 (Ctrl/⌘+Z)"><svg viewBox="0 0 24 24"><path d="M8.5 13.5L4 9l4.5-4.5M4 9h10a6 6 0 1 1 0 12h-3.5"/></svg></button>
  <button class="tb" id="bRedo" title="重做 (Ctrl/⌘+Shift+Z)"><svg viewBox="0 0 24 24"><path d="M15.5 13.5L20 9l-4.5-4.5M20 9H10a6 6 0 1 0 0 12h3.5"/></svg></button>
  <div class="sep"></div>
  <button class="tb" id="bOpen" title="打开工程 (.json / 无界思维 .html)"><svg viewBox="0 0 24 24"><path d="M3.5 8V5.8A1.8 1.8 0 0 1 5.3 4h4.2l2 2.2h7.2a1.8 1.8 0 0 1 1.8 1.8V8M3.5 8h17l-1.6 10.4a1.8 1.8 0 0 1-1.8 1.6H6.9a1.8 1.8 0 0 1-1.8-1.6z"/></svg></button>
  <button class="tb" id="bSave" title="保存 (Ctrl/⌘+S)"><svg viewBox="0 0 24 24"><path d="M4.5 4.5h11l4 4v11h-15zM8 4.5V9h7V4.5M7.5 19.5v-6h9v6"/></svg></button>
  <button class="tb" id="bExport" title="导出 (PNG / SVG / 大纲文本 / JSON)"><svg viewBox="0 0 24 24"><path d="M12 3.5V15m0 0l-4.2-4.2M12 15l4.2-4.2M4.5 20.5h15"/></svg></button>
  <button class="tb" id="bHelp" title="帮助与快捷键 (?)"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M9.5 9.4A2.6 2.6 0 0 1 12 7.5c1.5 0 2.6 1 2.6 2.3 0 1.8-2.6 2-2.6 3.7"/><circle cx="12" cy="16.6" r=".4" fill="currentColor"/></svg></button>
</header>

<div id="zoombar">
  <button class="tb" id="zOut" title="缩小"><svg viewBox="0 0 24 24"><path d="M6 12h12"/></svg></button>
  <button id="zPct" title="点击回到 100%">100%</button>
  <button class="tb" id="zIn" title="放大"><svg viewBox="0 0 24 24"><path d="M12 6v12M6 12h12"/></svg></button>
  <button class="tb" id="zFit" title="缩放至全览 (Ctrl/⌘+0)"><svg viewBox="0 0 24 24"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5"/></svg></button>
</div>

<div id="sheetdock">
  <div id="folderbar"></div>
  <div id="sheetbar"></div>
</div>

<div id="penbar">
  <button class="pk" id="pkPen" title="钢笔（压感）"><svg viewBox="0 0 24 24"><path d="M4 20.2l1-4.1L15.6 5.5a2.3 2.3 0 0 1 3.2 3.2L8.1 19.3z"/><path d="M14.2 6.9l3.2 3.2"/></svg></button>
  <button class="pk" id="pkHl" title="荧光笔"><svg viewBox="0 0 24 24"><path d="M6 16.5l-1.6 3.9 4-1.3L19.4 8.1a2.2 2.2 0 0 0-3.1-3.1z"/><path d="M4 21.5h16" stroke-width="2.6"/></svg></button>
  <button class="pk" id="pkEr" title="橡皮擦"><svg viewBox="0 0 24 24"><path d="M8.6 19.5H20M4.6 15.2l6-6a2 2 0 0 1 2.8 0l4.3 4.3a2 2 0 0 1 0 2.8l-3.2 3.2H8.4l-3.8-3.8a1.8 1.8 0 0 1 0-2.5z"/></svg></button>
  <div class="sep"></div>
  <div id="inkColors" style="display:flex;align-items:center"></div>
  <div class="sep"></div>
  <div id="inkWidths" style="display:flex;align-items:center"></div>
  <div class="sep"></div>
  <label title="用 Apple Pencil 触碰画布即开始书写，手指仍用于平移和缩放"><input type="checkbox" id="penAuto" checked>Pencil 直接书写</label>
  <button class="pk" id="pkDone" title="退出手写模式 (Esc)"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg></button>
</div>

<div id="fsChip" data-s="ro"><i></i><span>…</span></div>
<div id="minimapWrap"><canvas id="minimap" width="176" height="118"></canvas></div>

<div id="ctxbar"></div>

<div id="lens">
  <div id="lensClip"><div id="lensWorld"></div></div>
  <div id="lensHud">×2.5</div>
  <div id="lensBar">
    <button id="lensGo" class="primary" title="把画布视角切换到该区域"><svg viewBox="0 0 24 24"><path d="M4 14v6h6M20 10V4h-6M4 20L20 4"/></svg>进入此区域</button>
    <button id="lensClose" title="退出放大镜"><svg viewBox="0 0 24 24"><path d="M5 5l14 14M19 5L5 19"/></svg>关闭</button>
  </div>
</div>

<div id="menu"></div>

<div class="overlay" id="dlgImport">
  <div class="dlg">
    <h3>树形文本 → 思维导图</h3>
    <div class="sub">粘贴任意树状结构文本，一键生成 XMind 式导图。支持 <b>│ ├─ └─ 制表符画的树</b>、空格/Tab 缩进层级、Markdown 列表（- / •）。</div>
    <textarea id="importText" spellcheck="false" placeholder="在此粘贴树形文本…"></textarea>
    <div class="dlgBtns">
      <button class="btn" id="impCancel">取消</button>
      <button class="btn" id="impSample">填入示例</button>
      <button class="btn primary" id="impGo">生成导图</button>
    </div>
  </div>
</div>

<div class="overlay" id="dlgHelp">
  <div class="dlg">
    <h3>帮助 · 快捷键</h3>
    <div class="sub">无界思维 = 无边际画布(Freeform 体感) × 思维导图(XMind 体感)。导图、文本框、图片之间都可以用连接线相互关联。</div>
    <div class="helpG" id="helpGrid"></div>
    <div class="dlgBtns"><button class="btn primary" id="helpClose">知道了</button></div>
  </div>
</div>

<div id="toast"></div>
<input type="text" id="labelInput" placeholder="连线标签…">
<input type="file" id="fileImg" accept="image/*" hidden>
<input type="file" id="fileJson" accept=".json,.html,.htm,application/json,text/html" hidden>
<!-- 无界思维 · 工程数据（自动写入，请勿手动修改；保存时只会替换这一块） -->
<script id="im-data" type="application/json"></script>

<script>
"use strict";
/* ============================================================
   工具函数 & 全局状态
   ============================================================ */
const $=s=>document.querySelector(s);
const stage=$("#stage"),world=$("#world"),wires=$("#wires"),gTree=$("#gTree"),gFree=$("#gFree"),gTemp=$("#gTemp"),
      wireDefs=$("#wireDefs"),itemLayer=$("#itemLayer"),laneLayer=$("#laneLayer"),marqueeEl=$("#marquee"),emptyHint=$("#emptyHint"),
      gInk=$("#gInk"),gDraw=$("#gDraw"),penbar=$("#penbar"),
      lensEl=$("#lens"),lensClip=$("#lensClip"),lensWorld=$("#lensWorld"),lensHud=$("#lensHud"),
      ctxbar=$("#ctxbar"),menuEl=$("#menu"),toastEl=$("#toast"),labelInput=$("#labelInput"),
      minimap=$("#minimap"),mmCtx=minimap.getContext("2d");
const clamp=(v,a,b)=>Math.min(b,Math.max(a,v));
const r1=v=>Math.round(v*10)/10;
let _uid=0;const uid=p=>(p||"i")+(++_uid)+"_"+Math.random().toString(36).slice(2,6);
const isMac=/Mac|iPhone|iPad/.test(navigator.platform||navigator.userAgent);
const MOD=e=>isMac?e.metaKey:e.ctrlKey;

const PAL=["#2563EB","#0D9488","#D97706","#DC2626","#7C3AED","#16A34A","#DB2777","#475569"];
const INK="#1F2937";
const NOTE_BGS=["#FFFFFF","transparent","#FEF3C7","#DBEAFE","#DCFCE7","#FCE7F3"];
/* 流程块：形状 + 配色 */
const FLOW_PAL=[
  {bg:"#EEF2FF",bd:"#6366F1",fg:"#3730A3"},   // 0 靛蓝（处理）
  {bg:"#1F2937",bd:"#1F2937",fg:"#FFFFFF"},   // 1 深色（开始）
  {bg:"#DCFCE7",bd:"#16A34A",fg:"#15803D"},   // 2 绿（结束/通过）
  {bg:"#FEF3C7",bd:"#D97706",fg:"#B45309"},   // 3 橙（判断）
  {bg:"#FCE7F3",bd:"#DB2777",fg:"#BE185D"},   // 4 粉（数据）
  {bg:"#DBEAFE",bd:"#2563EB",fg:"#1D4ED8"},   // 5 蓝
  {bg:"#F1F5F9",bd:"#94A3B8",fg:"#475569"},   // 6 灰
];
const SHAPES={
  start:{name:"开始 / 结束",c:1,w:150,minH:42,padX:.10,vf:1,  vpad:11},
  proc :{name:"处理",      c:0,w:176,minH:52,padX:.09,vf:1,  vpad:14},
  dia  :{name:"判断",      c:3,w:166,minH:96,padX:.24,vf:.5, vpad:10},
  data :{name:"数据",      c:4,w:176,minH:52,padX:.16,vf:1,  vpad:14},

      o.color=it.color;o.sw=it.sw;o.hl=!!it.hl;

      it.w=bb.w;it.h=bb.h;

function scrollIntoBar(bar,el){
  if(!bar||!el)return;

const toWorld=(sx,sy)=>({x:(sx-S.cam.x)/S.cam.z,y:(sy-S.cam.y)/S.cam.z});

function animateCam(tx,ty,tz,dur=380,done){
  if(camAnim)cancelAnimationFrame(camAnim.raf);
  const f={...S.cam},t0=performance.now();
  const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;
  const step=now=>{
    const p=clamp((now-t0)/dur,0,1),e=ease(p);
    S.cam.x=f.x+(tx-f.x)*e;S.cam.y=f.y+(ty-f.y)*e;S.cam.z=f.z+(tz-f.z)*e;
    applyCam();
    if(p<1)camAnim={raf:requestAnimationFrame(step)};
    else{camAnim=null;updateCtxbar();if(done)done();}
  };
  camAnim={raf:requestAnimationFrame(step)};
}
function contentBBox(){

    any=true;
    x1=Math.min(x1,it.x);y1=Math.min(y1,it.y);
    x2=Math.max(x2,it.x+(it.w||0));y2=Math.max(y2,it.y+(it.h||0));
  }
  return any?{x:x1,y:y1,w:x2-x1,h:y2-y1}:null;
}
function fitView(animate=true){

  const z=clamp(Math.min((innerWidth-140)/bb.w,(innerHeight-190)/bb.h),0.06,1.3);
  const tx=(innerWidth-bb.w*z)/2-bb.x*z;
  const ty=(innerHeight-bb.h*z)/2-bb.y*z+14;

const kidsOf=n=>n.ch.map(id=>IT.get(id)).filter(k=>k&&!k._lift);
function depthOf(n){let d=0,cur=n;while(cur.p){cur=IT.get(cur.p);if(!cur)break;d++;if(d>200)break;}return d;}
function rootOf(n){let cur=n;while(cur.p&&IT.has(cur.p))cur=IT.get(cur.p);return cur;}
function isVisible(n){ // 祖先折叠则不可见
  let cur=n;
  while(cur.p){const p=IT.get(cur.p);if(!p)break;if(p.collapsed)return false;cur=p;}
  return true;
}
function subtreeIds(id,out){
  out=out||[];const n=IT.get(id);if(!n)return out;
  out.push(id);
  if(n.t==="node")for(const c of n.ch)subtreeIds(c,out);
  return out;
}
function descCount(n){let c=0;for(const k of n.ch){c++;const kn=IT.get(k);if(kn)c+=descCount(kn);}return c;}
function branchColor(n){
  let cur=n,l1=null;
  while(cur){
    if(cur.colO!=null)return PAL[cur.colO%PAL.length];
    const p=cur.p?IT.get(cur.p):null;
    if(p&&!p.p)l1=cur;
    if(!p){if(cur===n)return INK;break;}
    cur=p;
  }
  const root=cur,idx=l1?root.ch.indexOf(l1.id):0;
  return PAL[(idx<0?0:idx)%PAL.length];
}

function layoutAll(){
  for(const it of IT.values())
    if(it.t==="node"&&!it.p&&!it._lift)layoutTree(it);

function layoutTree(root){
  (function calc(n){
    const kids=n.collapsed?[]:kidsOf(n);
    if(!kids.length){n._sh=n.h;return;}
    let s=0;for(const k of kids){calc(k);s+=k._sh;}
    s+=GAP_V*(kids.length-1);
    n._sh=Math.max(n.h,s);
  })(root);
  (function place(n){
    const kids=n.collapsed?[]:kidsOf(n);
    if(!kids.length)return;
    const x=n.x+n.w+GAP_H;
    const total=kids.reduce((a,k)=>a+k._sh,0)+GAP_V*(kids.length-1);
    let cur=n.y+n.h/2-total/2;
    for(const k of kids){
      k.x=x;k.y=cur+(k._sh-k.h)/2;
      cur+=k._sh+GAP_V;
      place(k);
    }
  })(root);
}
function positionAll(){

/* ---------- 导图分支线 ---------- */
function branchPath(p,c){
  const x1=p.x+p.w,y1=p.y+p.h/2,x2=c.x,y2=c.y+c.h/2;
  const mx=(x2-x1)*0.55;
  return `M${r1(x1)} ${r1(y1)} C${r1(x1+mx)} ${r1(y1)}, ${r1(x2-mx)} ${r1(y2)}, ${r1(x2)} ${r1(y2)}`;
}
function drawTree(){
  let s="";
  for(const it of IT.values()){
    if(it.t!=="node"||it.collapsed||!isVisible(it))continue;
    for(const cid of it.ch){
      const c=IT.get(cid);
      if(!c||(c._lift&&!it._lift))continue;
      const col=branchColor(c),wd=Math.max(1.4,2.9-0.5*depthOf(c));
      s+=`<path d="${branchPath(it,c)}" fill="none" stroke="${col}" stroke-width="${wd}" stroke-linecap="round"/>`;
    }
  }
  gTree.innerHTML=s;
}
/* ============================================================
   手写墨迹：压感轮廓路径（类 perfect-freehand 的轻量实现）
   ============================================================ */
function inkPath(pts,sw,hl){
  const n=pts.length;
  if(!n)return "";
  const rB=sw/2;
  if(n===1){
    const x=pts[0][0],y=pts[0][1];
    const r=Math.max(.7,rB*(hl?1:(.45+.55*pts[0][2])));
    return `M${r1(x-r)} ${r1(y)}a${r1(r)} ${r1(r)} 0 1 0 ${r1(2*r)} 0a${r1(r)} ${r1(r)} 0 1 0 ${r1(-2*r)} 0`;
  }
  const L=[],R=[],taper=Math.min(7,Math.max(1,(n-1)/2));
  for(let i=0;i<n;i++){
    const a=pts[Math.max(0,i-1)],b=pts[Math.min(n-1,i+1)];
    let dx=b[0]-a[0],dy=b[1]-a[1];
    const len=Math.hypot(dx,dy)||1;dx/=len;dy/=len;
    let r=hl?rB:rB*(.38+.62*pts[i][2]);
    if(!hl){                                  // 起收笔渐细
      const t=Math.min(i,n-1-i)/taper;
      r*=Math.min(1,.3+.7*Math.min(1,t));
    }
    r=Math.max(.35,r);
    const nx=-dy*r,ny=dx*r;
    L.push([pts[i][0]+nx,pts[i][1]+ny]);
    R.push([pts[i][0]-nx,pts[i][1]-ny]);
  }
  const seg=a=>{
    let s="";
    for(let i=1;i<a.length-1;i++)
      s+=`Q${r1(a[i][0])} ${r1(a[i][1])} ${r1((a[i][0]+a[i+1][0])/2)} ${r1((a[i][1]+a[i+1][1])/2)}`;
    const e=a[a.length-1];
    return s+`L${r1(e[0])} ${r1(e[1])}`;
  };
  const Rr=R.slice().reverse();
  return `M${r1(L[0][0])} ${r1(L[0][1])}${seg(L)}L${r1(Rr[0][0])} ${r1(Rr[0][1])}${seg(Rr)}Z`;
}
function inkBBox(pts,sw){
  let x1=1/0,y1=1/0,x2=-1/0,y2=-1/0;
  for(const p of pts){x1=Math.min(x1,p[0]);y1=Math.min(y1,p[1]);x2=Math.max(x2,p[0]);y2=Math.max(y2,p[1]);}
  const m=sw/2+1;
  return {x:x1-m,y:y1-m,w:(x2-x1)+m*2,h:(y2-y1)+m*2};
}
function inkStyle(it){
  return it.hl
    ? `fill:${it.color};fill-opacity:.38;mix-blend-mode:multiply`
    : `fill:${it.color}`;
}
function inkEl(it){
  const el=document.createElementNS("http://www.w3.org/2000/svg","path");
  el.setAttribute("d",it.d||(it.d=inkPath(it.pts,it.sw,it.hl)));
  el.setAttribute("style",inkStyle(it));
  el.setAttribute("class","hit");
  el.dataset.id=it.id;
  return el;
}
function inkHit(it,wx,wy,rad){
  const r=(it.sw/2)+rad;
  if(wx<it.x-r||wx>it.x+it.w+r||wy<it.y-r||wy>it.y+it.h+r)return false;
  const dx=it.x-it.ox,dy=it.y-it.oy;                   // 位移补偿
  const rr=r*r;
  for(let i=0;i<it.pts.length;i++){
    const px=it.pts[i][0]+dx,py=it.pts[i][1]+dy;
    if((px-wx)**2+(py-wy)**2<=rr)return true;
    if(i){                                              // 线段最近距离
      const qx=it.pts[i-1][0]+dx,qy=it.pts[i-1][1]+dy;
      const vx=px-qx,vy=py-qy,L2=vx*vx+vy*vy;
      if(L2>0){
        let t=((wx-qx)*vx+(wy-qy)*vy)/L2;
        t=clamp(t,0,1);
        const cx=qx+vx*t,cy=qy+vy*t;
        if((cx-wx)**2+(cy-wy)**2<=rr)return true;
      }
    }
  }
  return false;
}

/* ---------- 自由连接线 ---------- */
function bezPoint(t,p0,p1,p2,p3){
  const u=1-t;
  return {
    x:u*u*u*p0.x+3*u*u*t*p1.x+3*u*t*t*p2.x+t*t*t*p3.x,
    y:u*u*u*p0.y+3*u*u*t*p1.y+3*u*t*t*p2.y+t*t*t*p3.y
  };
}
/* 连线端点：整个对象，或任务清单中的某一项 */
function anchorRect(id,rid){
  const it=IT.get(id);
  if(!it)return null;

const URL_RE=/((?:https?:\/\/|www\.)[^\s<>"'\uff09\u3011\u3001\u3002\uff0c\uff1b\uff1a)\]]+)/g;
function safeHref(u){
  const raw=deEnt(String(u==null?"":u)).trim();
  const href=/^www\./i.test(raw)?"https://"+raw:raw;
  return /^https?:\/\/[^\s]+$/i.test(href)?href:null;

function linkify(html){
  const str=String(html==null?"":html);
  if(str.indexOf("http")<0&&str.indexOf("www.")<0)return str;
  return str.replace(/(<[^>]+>)|([^<]+)/g,(m,tag,txt)=>{
    if(tag)return tag;
    return String(txt).replace(URL_RE,u=>{
      let trail="";
      const mm=/[.,;:!?)\]}]+$/.exec(u);
      if(mm){trail=mm[0];u=u.slice(0,u.length-trail.length);}
      const href=safeHref(u);
      if(!href)return u+trail;
      return `<a class="lnk" draggable="false" href="${escXML(href)}" target="_blank" rel="noopener noreferrer" title="${escXML(href)}">${u}</a>`+trail;
    });
  });
}

    const i=ef.i,f=ef.f;
    finishEdit();
    if(f==="t")startTodoEdit(id,i,"d",true);
    else if(f==="d"&&it.rows[i+1])startTodoEdit(id,i+1,"t",true);
    return;
  }
  if(e.key==="Backspace"&&ef.f==="t"){
    const cur=e.target.innerText.replace(/\u00A0/g," ").trim();
    const r=it.rows[ef.i];
    if(!cur&&r&&!(r.d||"").trim()&&it.rows.length>1){
      e.preventDefault();
      const at=ef.i;
      S.editing=null;S.editField=null;
      dropRowEdges(it.rows[at]&&it.rows[at].id);
      it.rows.splice(at,1);
      pushHistory();render(true);
      if(it.rows[at-1])startTodoEdit(id,at-1,"t",false);
      return;
    }
  }
}
function finishTodoEdit(silent,revert){
  const id=S.editing,ef=S.editField;
  S.editing=null;S.editField=null;
  const it=IT.get(id),el=EL.get(id);
  if(!it||!el)return;
  const node=todoField(el,ef.i,ef.f);
  if(!node)return;
  if(revert)node.innerHTML=editOrig.html;
  node.removeEventListener("keydown",todoKeydown);
  node.removeEventListener("blur",todoBlur);
  node.removeEventListener("paste",editPaste);
  node.removeEventListener("input",todoInput);
  node.contentEditable="false";
  node.classList.remove("editing-f");
  el.classList.remove("editing");
  const html=cleanChildren(node).replace(/(<br>)+$/,"");
  const text=node.innerText.replace(/\u00A0/g," ").replace(/\n+$/,"");
  if(ef.f==="title"){it.title=text.trim()||"任务清单";it.titleHtml=html||escapeToHtml(it.title);}
  else if(ef.f==="sub"){it.sub=text;it.subHtml=html;}
  else{
    const r=it.rows[ef.i];
    if(r){
      if(ef.f==="t"){r.t=text;r.th=html;}
      else{
        r.d=text;r.dh=html;
        delete r._open;
        if(!text.trim()){r.d="";r.dh="";}
      }
    }
  }
  // 新加却没填内容的空行：自动移除，避免留下空条目
  if(ef.f==="t"&&it.rows.length>1){
    const r=it.rows[ef.i];
    if(r&&!(r.t||"").trim()&&!(r.d||"").trim()&&!r.g&&!r.k){
      it.rows.splice(ef.i,1);dropRowEdges(r.id);
    }
  }
  dirtyMeasure.add(id);
  if(!silent){pushHistory();render(true);}
}
function dropRowEdges(rid){
  if(!rid)return;
  for(const [eid,e] of [...ED])if(e.ar===rid||e.br===rid)ED.delete(eid);
}
function addTodoRow(id,at,edit){
  const it=IT.get(id);if(!it)return;
  const n={id:rowId(),t:"",th:"",d:"",dh:"",g:"",k:false};
  at=at==null?it.rows.length:clamp(at,0,it.rows.length);
  it.rows.splice(at,0,n);
  pushHistory();render(true);
  if(edit)setTimeout(()=>startTodoEdit(id,at,"t",true),0);
}
function editInput(){
  const id=S.editing;if(!id)return;
  dirtyMeasure.add(id);
  measure();layoutAll();positionAll();drawTree();drawFree();
  updateCtxbar();
  if(S.lens.on)syncLensContent();
}
function editPaste(e){
  e.preventDefault();
  const dt=e.clipboardData||window.clipboardData;
  const txt=clipboardText(dt);
  document.execCommand("insertHTML",false,escapeToHtml(txt));
  editInput();
}
function editKeydown(e){
  e.stopPropagation();
  const id=S.editing;if(!id)return;
  const it=IT.get(id);
  if(MOD(e)){
    const k=e.key.toLowerCase();
    if(k==="b"){e.preventDefault();fmtCmd("bold");return;}
    if(k==="i"){e.preventDefault();fmtCmd("italic");return;}
    if(k==="u"){e.preventDefault();fmtCmd("underline");return;}
    if(k==="s"){e.preventDefault();finishEdit();saveFile();return;}
    return; // 其余组合键交给浏览器（编辑内 ⌘Z 为输入撤销）
  }
  if(e.key==="Escape"){
    e.preventDefault();
    finishEdit(false,it.t==="node"); // 节点 Esc 还原
    return;
  }
  if(it.t==="node"){
    if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();finishEdit();addSibling(id);pushHistory();return;}
    if(e.key==="Tab"){e.preventDefault();finishEdit();addChild(id);pushHistory();return;}
    if(e.key==="Enter"&&e.shiftKey){e.preventDefault();document.execCommand("insertLineBreak");editInput();return;}
  }else{
    if(e.key==="Enter"){e.preventDefault();document.execCommand("insertLineBreak");editInput();return;}
    if(e.key==="Tab"){e.preventDefault();document.execCommand("insertText",false,"    ");return;}
  }
}
function fmtCmd(cmd,val){
  if(!S.editing)return;
  document.execCommand(cmd,false,val||null);
  editInput();
}
function editBlur(){finishEdit();}
/* ---------- 链接卡片：重命名（地址不变，点击仍跳转） ---------- */
function startLinkEdit(id,selectAll){
  finishEdit();
  const it=IT.get(id),el=EL.get(id);
  if(!it||!el||!noteIsLink(it))return;
  const node=el.querySelector(".lnk-host");
  if(!node)return;
  S.editing=id;S.editField={f:"ltitle"};
  editOrig={text:it.ltitle||"",html:node.innerHTML};
  node.contentEditable="true";
  node.classList.add("editing-f");
  node.style.whiteSpace="pre-wrap";node.style.overflow="visible";node.style.textOverflow="clip";
  el.classList.add("editing");
  node.focus();
  const rg=document.createRange();rg.selectNodeContents(node);
  const sl=getSelection();sl.removeAllRanges();sl.addRange(rg);
  if(!selectAll)sl.collapseToEnd();
  node.addEventListener("keydown",linkKeydown);
  node.addEventListener("blur",linkBlur);
  node.addEventListener("paste",editPaste);
  node.addEventListener("input",todoInput);
  updateCtxbar();
  toast("正在重命名 · 回车确认（地址不变，点击卡片仍会跳转）");
}
function linkBlur(){finishEdit();}
function linkKeydown(e){
  e.stopPropagation();
  if(MOD(e)){
    const k=e.key.toLowerCase();
    if(k==="b"){e.preventDefault();fmtCmd("bold");return;}
    if(k==="i"){e.preventDefault();fmtCmd("italic");return;}
    return;
  }
  if(e.key==="Enter"){e.preventDefault();finishEdit();return;}
  if(e.key==="Escape"){e.preventDefault();finishEdit(false,true);return;}
}
function finishLinkEdit(silent,revert){
  const id=S.editing;
  S.editing=null;S.editField=null;
  const it=IT.get(id),el=EL.get(id);
  if(!it||!el)return;
  const node=el.querySelector(".lnk-host");
  if(!node)return;
  if(revert)node.innerHTML=editOrig.html;
  node.removeEventListener("keydown",linkKeydown);
  node.removeEventListener("blur",linkBlur);
  node.removeEventListener("paste",editPaste);
  node.removeEventListener("input",todoInput);
  node.contentEditable="false";
  node.classList.remove("editing-f");
  el.classList.remove("editing");
  const t=node.innerText.replace(/\u00A0/g," ").replace(/\s+/g," ").trim();
  const {host}=linkParts(safeHref(it.text)||"");
  it.ltitle=(t&&t!==host)?t:"";                 // 与域名一致则视为未命名
  dirtyMeasure.add(id);
  if(!silent){pushHistory();render(true);}
}
function laneField(el,f,i){
  return (f==="title")?el.querySelector('[data-f="title"]')
    :el.querySelector(`.ln-f[data-f="${f}"][data-i="${i}"]`);
}
function startLaneEdit(id,f,i,selectAll){
  finishEdit();
  const it=IT.get(id),el=EL.get(id);
  if(!it||!el)return;
  const node=laneField(el,f,i);
  if(!node)return;
  S.editing=id;S.editField={f:"lane:"+f,i};
  editOrig={text:"",html:node.innerHTML};
  node.contentEditable="true";
  node.classList.add("editing-f");
  node.focus();
  const rg=document.createRange();rg.selectNodeContents(node);
  const sl=getSelection();sl.removeAllRanges();sl.addRange(rg);
  if(!selectAll)sl.collapseToEnd();
  node.addEventListener("keydown",laneKeydown);
  node.addEventListener("blur",laneBlur);
  node.addEventListener("paste",editPaste);
  updateCtxbar();
}
function laneBlur(){finishEdit();}
function laneKeydown(e){
  e.stopPropagation();
  if(e.key==="Enter"||e.key==="Escape"){e.preventDefault();finishEdit();}
}
function finishLaneEdit(silent){
  const id=S.editing,ef=S.editField;
  S.editing=null;S.editField=null;
  const it=IT.get(id),el=EL.get(id);
  if(!it||!el)return;
  const f=ef.f.slice(5);
  const node=laneField(el,f,ef.i);
  if(!node)return;
  node.removeEventListener("keydown",laneKeydown);
  node.removeEventListener("blur",laneBlur);
  node.removeEventListener("paste",editPaste);
  node.contentEditable="false";
  node.classList.remove("editing-f");
  const t=node.innerText.replace(/\u00A0/g," ").replace(/\s+/g," ").trim();
  if(f==="title"){it.title=t||"工作流泳道";it.titleHtml=escapeToHtml(it.title);}
  else if(f==="lane"&&it.lanes[ef.i])it.lanes[ef.i].name=t;
  else if(f==="col"&&it.cols[ef.i])it.cols[ef.i].name=t;
  dirtyMeasure.add(id);
  if(!silent){pushHistory();render(true);}
}
function finishEdit(silent,revert){
  if(S.editField&&/^lane:/.test(S.editField.f))return finishLaneEdit(silent);
  if(S.editField)
    return S.editField.f==="ltitle"?finishLinkEdit(silent,revert):finishTodoEdit(silent,revert);
  const id=S.editing;if(!id)return;
  const it=IT.get(id),el=EL.get(id);
  S.editing=null;
  if(!it||!el)return;
  const tx=el.querySelector(".txt");
  if(revert)tx.innerHTML=editOrig.html;
  tx.removeEventListener("keydown",editKeydown);
  tx.removeEventListener("blur",editBlur);
  tx.removeEventListener("paste",editPaste);
  tx.removeEventListener("input",editInput);
  tx.contentEditable="false";
  el.classList.remove("editing");
  let html=cleanChildren(tx).replace(/(<br>)+$/,"");
  let text=tx.innerText.replace(/\u00A0/g," ").replace(/\n+$/,"");
  if(it.t==="shape"){
    it.text=text;it.html=html;
    dirtyMeasure.add(id);
    if(!silent){if(it.html!==editOrig.html)pushHistory();render(true);}
    return;
  }
  if(it.t==="node"){
    if(!text.trim()){
      text=editOrig.text||(it.p?defaultChildText(IT.get(it.p)||{}):"中心主题");
      html=escapeToHtml(text);
    }
    it.text=text;it.html=html;
  }else{
    it.text=text;it.html=html;
    if(!text.trim()&&!silent){ // 空文本框 → 删除
      removeItems([id]);pushHistory();render(true);return;
    }
  }
  dirtyMeasure.add(id);
  if(!silent){
    if(it.html!==editOrig.html)pushHistory();
    render(true);
  }
}

function updateCtxbar(){
  ctxbar.style.display="none";ctxbar.textContent="";

  if(S.editing){
    if(IT.has(S.editing))buildFormatBar(IT.get(S.editing));

  }
  // 连线被选中
  if(S.selEdge&&ED.has(S.selEdge)){
    const e=ED.get(S.selEdge);
    if(!edgeVisible(e))return;
    const g=geomOf(e);
    const sp=toScreen(g.mid.x,g.mid.y);

function noteFsApply(it){

function placeCtxbar(cx,ty){

/* ============================================================
   指针交互（选择/拖动/改挂/框选/平移/捏合/连线/放大镜）
   ============================================================ */
let G=null;               // 当前手势
const ptrs=new Map();     // 触摸多指
function itemFromEvent(e){
  const t=e.target.closest?e.target.closest("[data-id]"):null;
  return t?IT.get(t.dataset.id):null;
}
function nodeAtPoint(wx,wy,excl){
  let best=null,bd=1/0;
  for(const it of IT.values()){
    if(it.t!=="node"||!isVisible(it)||(excl&&excl.has(it.id)))continue;
    const dx=Math.max(it.x-wx,0,wx-(it.x+it.w));
    const dy=Math.max(it.y-wy,0,wy-(it.y+it.h));
    const d=Math.hypot(dx,dy);
    if(d<bd){bd=d;best=it;}
  }
  return bd<=46/S.cam.z?best:null;
}
function cap(e){try{stage.setPointerCapture(e.pointerId);}catch(_){}}
function capId(pid){try{stage.setPointerCapture(pid);}catch(_){}}
/* ============================================================
   手写绘制：Apple Pencil 压感 + 高频采样 + 手掌拒识
   ============================================================ */
const curInk=()=>S.ink.mode==="hl"
  ? {color:HL_COLORS[S.ink.hci],sw:HL_W[S.ink.hwi],hl:true}
  : {color:INK_COLORS[S.ink.ci],sw:INK_W[S.ink.wi],hl:false};
function pressureOf(e){
  if(e.pointerType==="pen")return clamp(e.pressure>0?e.pressure:.42,.06,1);
  if(e.pointerType==="touch")return .58;
  return .5;                                   // 鼠标：恒定中等力度
}
function beginStroke(e){
  const w=toWorld(e.clientX,e.clientY);
  const cfg=curInk();
  G={kind:"ink",pts:[[w.x,w.y,pressureOf(e)]],cfg,pid:e.pointerId,last:w};
  cap(e);
  ctxbar.style.display="none";
  gDraw.innerHTML=`<path style="${inkStyle(cfg)}" d=""/>`;
}
function extendStroke(e){
  const pts=G.pts,cfg=G.cfg;
  const evs=(e.getCoalescedEvents&&e.getCoalescedEvents().length)?e.getCoalescedEvents():[e];
  const minD=Math.max(.7,1.5/S.cam.z);         // 世界坐标下的最小采样间距
  for(const ev of evs){
    const w=toWorld(ev.clientX,ev.clientY);
    const prev=pts[pts.length-1];
    if(Math.hypot(w.x-prev[0],w.y-prev[1])<minD)continue;
    // 位置轻度平滑，压力更强平滑，避免锯齿与突变
    const x=prev[0]+(w.x-prev[0])*.72,y=prev[1]+(w.y-prev[1])*.72;
    const pr=prev[2]+(pressureOf(ev)-prev[2])*.32;
    pts.push([x,y,pr]);
  }
  const el=gDraw.firstChild;
  if(el)el.setAttribute("d",inkPath(pts,cfg.sw,cfg.hl));
}
function endStroke(aborted){
  const g=G;
  gDraw.innerHTML="";
  if(aborted||!g||g.pts.length<1)return;
  const {cfg,pts}=g;
  const bb=inkBBox(pts,cfg.sw);
  const it={id:uid("k"),t:"ink",pts,color:cfg.color,sw:cfg.sw,hl:cfg.hl,
            ox:bb.x,oy:bb.y,x:bb.x,y:bb.y,w:bb.w,h:bb.h};
  it.d=inkPath(pts,cfg.sw,cfg.hl);
  IT.set(it.id,it);
  pushHistory();
  render(true);
}
function eraseAt(e){
  const w=toWorld(e.clientX,e.clientY);
  const rad=Math.max(7,14/S.cam.z);
  let hit=false;
  for(const it of [...IT.values()]){
    if(it.t!=="ink")continue;
    if(inkHit(it,w.x,w.y,rad)){IT.delete(it.id);hit=true;}
  }
  if(hit){S.sel.clear();render(true);G&&(G.erased=true);}
}
/* Pencil 直接书写：选择工具下笔尖落下即开始画 */
function penShouldDraw(e){
  if(e.pointerType!=="pen")return false;
  if(!S.ink.auto)return false;
  if(S.lens.on||S.editing||S.tool==="connect")return false;
  return true;
}

function startPan(e){
  cap(e);
  G={kind:"pan",sx:e.clientX,sy:e.clientY,cx:S.cam.x,cy:S.cam.y};
  stage.classList.add("panning");
  ctxbar.style.display="none";
}
function onDown(e){
  downPt={x:e.clientX,y:e.clientY,t:Date.now()};
  hideMenu();
  if(labelInput.style.display==="block")commitEdgeLabel();
  if(e.pointerType==="pen")S.ink.penSeen=true;
  // 手掌拒识：用过笔之后，手指不再绘制（仍可平移/缩放）
  if(e.pointerType==="touch"){
    ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(ptrs.size===2){
      if(G&&G.kind==="ink")gDraw.innerHTML="";
      finishGesture(true);
      const [a,b]=[...ptrs.values()];
      const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
      G={kind:"pinch",d0:Math.hypot(a.x-b.x,a.y-b.y)||1,z0:S.cam.z,w0:toWorld(mid.x,mid.y)};
      return;
    }
  }
  if(camAnim){cancelAnimationFrame(camAnim.raf);camAnim=null;}
  // ---- 放大镜模式 ----
  if(S.lens.on){
    if(e.button!==0)return;
    if(S.lens.pinned)unpinLens(e.clientX,e.clientY);
    else pinLens();
    return;
  }
  // ---- 平移 ----
  if(e.button===1||e.button===2||spaceHeld||S.tool==="hand"){startPan(e);return;}
  if(e.button!==0)return;
  // ---- 手写 / 橡皮 ----
  const wantPen=(S.tool==="pen"||S.tool==="eraser")
    ? (e.pointerType!=="touch"||!S.ink.penSeen)     // 用过 Pencil 后手指不画
    : penShouldDraw(e);
  if(wantPen){
    finishEdit();
    if(S.tool==="eraser"||(S.tool!=="pen"&&S.ink.mode==="er")){
      G={kind:"erase",pid:e.pointerId};cap(e);eraseAt(e);return;
    }
    if(S.tool==="pen"&&S.ink.mode==="er"){G={kind:"erase",pid:e.pointerId};cap(e);eraseAt(e);return;}
    beginStroke(e);return;
  }
  // ---- 连线模式 ----
  if(S.tool==="connect"){
    const ep=endpointAt(e);
    if(ep){
      if(!S.connectA){
        S.connectA={id:ep.id,rid:ep.rid,t:performance.now()};
        toast("再点另一个对象完成连线 · 再点它自己 = 自循环 · Esc 取消");
      }
      else if(!(ep.id===S.connectA.id&&(ep.rid||null)===(S.connectA.rid||null))){
        makeEdge(S.connectA,ep,e.shiftKey);
      }
      else if(performance.now()-(S.connectA.t||0)>250){   // 同一个对象再点一次 → 自循环
        makeEdge(S.connectA,ep,e.shiftKey);
      }
    }else{S.connectA=null;gTemp.innerHTML="";setTool("select");}
    return;
  }
  // ---- 选择工具 ----
  const tgl=e.target.closest?e.target.closest(".toggle"):null;
  if(tgl){
    const it=IT.get(tgl.parentElement.dataset.id);
    if(it){it.collapsed=!it.collapsed;pushHistory();render(true);}
    return;
  }
  // ---- 任务清单交互 ----
  const tdHost=e.target.closest?e.target.closest(".todo"):null;
  if(tdHost){
    const it=IT.get(tdHost.dataset.id);
    if(e.target.closest(".td-cb,.td-tag,.td-add,.td-grip,.td-adddesc"))e.preventDefault();
    const cb=e.target.closest(".td-cb");
    if(cb&&it){
      finishEdit();
      const r=it.rows[+cb.dataset.i];
      if(r){r.k=!r.k;dirtyMeasure.add(it.id);pushHistory();render(true);}
      return;
    }
    const tg=e.target.closest(".td-tag");
    if(tg&&it){
      finishEdit();
      const r=it.rows[+tg.dataset.i];
      if(r){
        const idx=TAG_CYCLE.indexOf(r.g);
        r.g=TAG_CYCLE[(idx<0?0:idx+1)%TAG_CYCLE.length];
        dirtyMeasure.add(it.id);pushHistory();render(true);
      }
      return;
    }
    const ad=e.target.closest(".td-adddesc");
    if(ad&&it){
      e.preventDefault();finishEdit();
      const i=+ad.dataset.i;
      setTimeout(()=>startTodoEdit(it.id,i,"d",true),0);
      return;
    }
    const add=e.target.closest(".td-add");
    if(add&&it){finishEdit();addTodoRow(it.id,null,true);return;}
    const lk=e.target.closest(".td-link");
    if(lk&&it){
      e.preventDefault();finishEdit();cap(e);
      const row=lk.closest(".td-row");
      row.classList.add("row-link");
      G={kind:"linkDrag",from:{id:it.id,rid:row.dataset.rid},row,target:null};
      toast("拖到另一个对象或清单项上松手即可连线");
      return;
    }
    const grip=e.target.closest(".td-grip");
    if(grip&&it){
      finishEdit();
      cap(e);
      const row=grip.closest(".td-row");
      row.classList.add("dragging");
      G={kind:"tdDrag",id:it.id,from:+grip.dataset.i,to:+grip.dataset.i,el:tdHost};
      return;
    }
    if(S.editing===it.id&&e.target.closest(".editing-f"))return;   // 编辑中：让光标操作
  }
  const rz=e.target.closest?e.target.closest(".rz,.rzc"):null;
  if(rz){
    const host=rz.parentElement,it=IT.get(host.dataset.id);
    if(!it)return;
    cap(e);
    if(rz.classList.contains("lnz"))G={kind:"rzLane",id:it.id,sh0:it.lh||150,sy:e.clientY};
    else if(rz.classList.contains("rz"))G={kind:"rzNote",id:it.id,sw:it.w,sx:e.clientX};
    else G={kind:"rzPic",id:it.id,sw:it.w,ratio:it.w/it.h,sx:e.clientX};
    return;
  }
  const eh=e.target.closest?e.target.closest(".fe-hit"):null;
  if(eh){
    S.sel.clear();S.selEdge=eh.dataset.eid;refreshSelClasses();
    return;
  }
  const it=itemFromEvent(e);
  if(it){
    if(S.editing===it.id)return;              // 正在编辑，让光标操作
    finishEdit();
    if(e.shiftKey){
      if(S.sel.has(it.id))S.sel.delete(it.id);else S.sel.add(it.id);
      S.selEdge=null;refreshSelClasses();return;
    }
    if(!S.sel.has(it.id))selectOnly(it.id);
    S.selEdge=null;refreshSelClasses();
    G={kind:"maybe-move",id:it.id,pid:e.pointerId,sx:e.clientX,sy:e.clientY};
    return;
  }
  // ---- 空白 ----
  finishEdit();
  if(e.pointerType==="touch"){startPan(e);G.clearOnTap=true;return;}
  G={kind:"maybe-marquee",pid:e.pointerId,sx:e.clientX,sy:e.clientY};
}
function promoteMove(e){
  const it=IT.get(G.id);
  if(!it){G=null;return;}
  if(it.t==="node"&&it.p&&S.sel.size===1){    // 分支拖拽 → 改挂/游离
    const ids=subtreeIds(it.id);
    const w=toWorld(e.clientX,e.clientY);
    const set=new Set(ids),offs=new Map();
    for(const id of ids){
      const n=IT.get(id);n._lift=true;
      offs.set(id,{dx:n.x-w.x,dy:n.y-w.y});
      const el=EL.get(id);if(el)el.classList.add("lifting");
    }
    G={kind:"lift",id:it.id,set,offs,target:null,idx:null};
    return;
  }
  if(it.t==="lane"&&S.sel.size===1){          // 拖泳道 → 里面的对象一起走
    const starts=new Map([[it.id,{x:it.x,y:it.y}]]);
    for(const o of IT.values())if(laneContains(it,o))starts.set(o.id,{x:o.x,y:o.y});
    G={kind:"move",starts,sx:G.sx,sy:G.sy,moved:false,soloRoot:null,target:null,treeSet:null};
    return;
  }
  const starts=new Map();
  for(const id of S.sel){
    const n=IT.get(id);
    if(!n)continue;
    if(n.t==="node"&&n.p)continue;            // 非根节点不参与整体移动
    starts.set(id,{x:n.x,y:n.y});
  }
  if(!starts.size&&it.t==="node"&&!it.p)starts.set(it.id,{x:it.x,y:it.y});
  const soloRoot=(starts.size===1&&it.t==="node"&&!it.p)?it.id:null;
  G={kind:"move",starts,sx:G.sx,sy:G.sy,moved:false,soloRoot,target:null,treeSet:soloRoot?new Set(subtreeIds(soloRoot)):null};
}
function setDropTarget(g,t){
  if(!g||g.target===((t&&t.id)||null))return;
  if(g.target){const el=EL.get(g.target);if(el)el.classList.remove("drop-target");}
  g.target=t?t.id:null;
  if(t){const el=EL.get(t.id);if(el)el.classList.add("drop-target");}
}
function onMove(e){
  if(e.pointerType==="touch"&&ptrs.has(e.pointerId))ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
  // 放大镜跟随
  if(S.lens.on&&!S.lens.pinned&&(!G||G.kind!=="pinch")){moveLens(e.clientX,e.clientY);return;}
  if(!G){
    if(S.tool==="connect"&&S.connectA){
      const w=toWorld(e.clientX,e.clientY);
      const A=anchorRect(S.connectA.id,S.connectA.rid);
      if(A)drawTempEdge(A,w);
    }
    return;
  }
  const z=S.cam.z;
  switch(G.kind){
    case "linkDrag":{
      const w=toWorld(e.clientX,e.clientY);
      const A=anchorRect(G.from.id,G.from.rid);
      if(A)drawTempEdge(A,w);
      if(G.target&&G.target.el)G.target.el.classList.remove("row-target","drop-target");
      const ep=endpointAt(e);
      G.target=null;
      if(ep&&!(ep.id===G.from.id&&ep.rid===G.from.rid)){
        let el=null;
        if(ep.rid){
          const host=EL.get(ep.id);
          el=host&&host.querySelector(`.td-row[data-rid="${ep.rid}"]`);
          if(el)el.classList.add("row-target");
        }else{
          el=EL.get(ep.id);
          if(el&&el.classList)el.classList.add("drop-target");
        }
        G.target={ep,el};
      }
      return;
    }
    case "tdDrag":{
      const rows=[...G.el.querySelectorAll(".td-row")];
      let to=G.from;
      for(const rw of rows){
        const b=rw.getBoundingClientRect();
        if(e.clientY>b.top+b.height/2)to=+rw.dataset.i+ (+rw.dataset.i>=G.from?0:1);
        rw.classList.remove("drop-above","drop-below");
      }
      let target=null;
      for(const rw of rows){
        const b=rw.getBoundingClientRect();
        if(e.clientY>=b.top&&e.clientY<=b.bottom){target=rw;break;}
      }
      if(target){
        const b=target.getBoundingClientRect();
        const above=e.clientY<b.top+b.height/2;
        target.classList.add(above?"drop-above":"drop-below");
        G.to=+target.dataset.i+(above?0:1);
      }else G.to=to;
      return;
    }
    case "ink":extendStroke(e);return;
    case "erase":eraseAt(e);return;
    case "pinch":{
      if(ptrs.size<2)return;
      const [a,b]=[...ptrs.values()];
      const mid={x:(a.x+b.x)/2,y:(a.y+b.y)/2};
      const d=Math.hypot(a.x-b.x,a.y-b.y)||1;
      const nz=clamp(G.z0*d/G.d0,0.04,4);
      S.cam.z=nz;S.cam.x=mid.x-G.w0.x*nz;S.cam.y=mid.y-G.w0.y*nz;
      applyCam();return;
    }
    case "pan":
      S.cam.x=G.cx+(e.clientX-G.sx);S.cam.y=G.cy+(e.clientY-G.sy);
      if(Math.hypot(e.clientX-G.sx,e.clientY-G.sy)>4)G.clearOnTap=false;
      applyCam();return;
    case "maybe-move":
      if(Math.hypot(e.clientX-G.sx,e.clientY-G.sy)>3.5){capId(G.pid);promoteMove(e);}
      return;
    case "maybe-marquee":
      if(Math.hypot(e.clientX-G.sx,e.clientY-G.sy)>4){
        capId(G.pid);
        G={kind:"marquee",sx:G.sx,sy:G.sy};
        marqueeEl.style.display="block";
      }
      return;
    case "marquee":{
      const x=Math.min(G.sx,e.clientX),y=Math.min(G.sy,e.clientY);
      const w=Math.abs(e.clientX-G.sx),h=Math.abs(e.clientY-G.sy);
      Object.assign(marqueeEl.style,{left:x+"px",top:y+"px",width:w+"px",height:h+"px"});
      G.rect={x,y,w,h};
      return;
    }
    case "move":{
      G.moved=true;
      const dx=(e.clientX-G.sx)/z,dy=(e.clientY-G.sy)/z;
      for(const [id,st] of G.starts){
        const n=IT.get(id);if(!n)continue;
        n.x=st.x+dx;n.y=st.y+dy;
      }
      layoutAll();positionAll();drawTree();drawFree();updateCtxbar();
      if(G.soloRoot){
        const w=toWorld(e.clientX,e.clientY);
        const t=nodeAtPoint(w.x,w.y,G.treeSet);
        setDropTarget(G,t&&insideBBox(t,w)?t:null);
      }
      if(S.lens.on)syncLensContent();
      return;
    }
    case "lift":{
      const w=toWorld(e.clientX,e.clientY);
      for(const [id,off] of G.offs){
        const n=IT.get(id);if(!n)continue;
        n.x=w.x+off.dx;n.y=w.y+off.dy;
      }
      const t=nodeAtPoint(w.x,w.y,G.set);
      setDropTarget(G,t);
      layoutAll();positionAll();drawTree();drawFree();
      return;
    }
    case "rzNote":{
      const it=IT.get(G.id);if(!it)return;
      const lo=it.t==="shape"?90:it.t==="lane"?320:150;
      it.w=clamp(G.sw+(e.clientX-G.sx)/z,lo,it.t==="lane"?2400:760);
      const el=EL.get(G.id);if(el)el.style.width=it.w+"px";
      if(it.t==="shape"&&el){
        el.querySelector("svg.shp").outerHTML=shapeSVG(it);
        const sp=SHAPES[it.sh]||SHAPES.proc,tx=el.querySelector(".txt");
        if(tx)tx.style.padding=shapePadCSS(it);
      }
      dirtyMeasure.add(G.id);measure();drawFree();updateCtxbar();
      return;
    }
    case "rzLane":{
      const it=IT.get(G.id);if(!it)return;
      it.lh=clamp(G.sh0+(e.clientY-G.sy)/z,70,420);
      dirtyMeasure.add(G.id);render(true);
      return;
    }
    case "rzPic":{
      const it=IT.get(G.id);if(!it)return;
      it.w=clamp(G.sw+(e.clientX-G.sx)/z,60,1600);
      it.h=it.w/G.ratio;
      const el=EL.get(G.id);
      if(el){el.style.width=it.w+"px";el.style.height=it.h+"px";}
      drawFree();updateCtxbar();
      return;
    }
  }
}
function insideBBox(it,w){return w.x>=it.x-8&&w.x<=it.x+it.w+8&&w.y>=it.y-8&&w.y<=it.y+it.h+8;}
function onUp(e){
  if(e.pointerType==="touch")ptrs.delete(e.pointerId);
  if(!G)return;
  finishGesture(false,e);
}
function finishGesture(aborted,e){
  const g=G;G=null;
  if(!g)return;
  stage.classList.remove("panning");
  switch(g.kind){
    case "linkDrag":{
      if(g.row)g.row.classList.remove("row-link");
      if(g.target&&g.target.el)g.target.el.classList.remove("row-target","drop-target");
      gTemp.innerHTML="";
      if(!aborted&&g.target&&g.target.ep)makeEdge(g.from,g.target.ep,false);
      else render();
      break;
    }
    case "tdDrag":{
      const it=IT.get(g.id);
      if(it&&!aborted&&g.to!=null&&g.to!==g.from&&g.to!==g.from+1){
        const [r]=it.rows.splice(g.from,1);
        it.rows.splice(g.to>g.from?g.to-1:g.to,0,r);
        pushHistory();
      }
      render(true);
      break;
    }
    case "ink":
      G=g;endStroke(aborted);G=null;
      break;
    case "erase":
      if(g.erased)pushHistory();
      break;
    case "pan":
      if(g.clearOnTap&&!aborted){selectOnly(null);}
      updateCtxbar();
      break;
    case "pinch":
      updateCtxbar();
      break;
    case "maybe-marquee":
      selectOnly(null);
      break;
    case "marquee":{
      marqueeEl.style.display="none";
      if(g.rect){
        const a=toWorld(g.rect.x,g.rect.y),b=toWorld(g.rect.x+g.rect.w,g.rect.y+g.rect.h);
        S.sel.clear();S.selEdge=null;
        for(const it of IT.values()){
          if(it.t==="node"&&!isVisible(it))continue;
          if(it.x<b.x&&it.x+it.w>a.x&&it.y<b.y&&it.y+it.h>a.y)S.sel.add(it.id);
        }
        refreshSelClasses();
      }
      break;
    }
    case "move":{
      if(g.moved){
        if(g.soloRoot&&g.target){
          const t=IT.get(g.target);
          if(t&&reparent(g.soloRoot,g.target)){toast("已并入该主题");}
        }
        setDropTarget(g,null);
        pushHistory();render(true);
      }
      break;
    }
    case "lift":{
      const it=IT.get(g.id);
      for(const id of g.set){const n=IT.get(id);if(n)delete n._lift;}
      if(it&&!aborted){
        if(g.target&&IT.has(g.target)){
          const t=IT.get(g.target);
          // 依据 Y 顺序确定插入位置
          const cy=it.y+it.h/2;
          let idx=t.ch.length;
          const kids=t.ch.map(id=>IT.get(id)).filter(Boolean);
          for(let i=0;i<kids.length;i++){if(cy<kids[i].y+kids[i].h/2){idx=i;break;}}
          reparent(it.id,g.target,idx);
        }else{
          detach(it.id,it.x,it.y);
        }
      }
      setDropTarget(g,null);
      pushHistory();render(true);
      break;
    }
    case "rzNote":case "rzPic":case "rzLane":
      pushHistory();render(true);
      break;
  }
}

stage.addEventListener("wheel",e=>{
  e.preventDefault();
  const k=e.deltaMode===1?16:1;
  let dx=e.deltaX*k,dy=e.deltaY*k;
  if(S.lens.on){
    S.lens.k=clamp(S.lens.k*Math.exp(-dy*0.0016),1.4,8);
    if(S.lens.pinned)applyLensTransform();
    else moveLens(S.lens.mx,S.lens.my,true);
    return;
  }
  if(e.ctrlKey||e.metaKey||e.altKey){
    zoomAt(e.clientX,e.clientY,S.cam.z*Math.exp(-dy*0.0022));
    return;
  }
  if(e.shiftKey&&!dx){dx=dy;dy=0;}
  S.cam.x-=dx;S.cam.y-=dy;
  applyCam();updateCtxbar();
},{passive:false});

/* ---------- 键盘 ---------- */
addEventListener("keydown",e=>{
  if(e.key===" "&&!S.editing&&!e.repeat){
    const t=e.target;
    if(!(t&&t.closest&&t.closest("input,textarea"))){spaceHeld=true;stage.classList.add("hand");e.preventDefault();}
    return;
  }
  if(S.editing)return;
  const t=e.target;
  if(t&&t.closest&&t.closest("input,textarea"))return;
  const key=e.key.toLowerCase();
  if(S.lens.on&&!MOD(e)&&key!=="z"&&e.key!=="Escape"&&key!=="?"&&key!=="？")return;
  if(MOD(e)){
    if(key==="z"){e.preventDefault();e.shiftKey?redo():undo();return;}
    if(key==="y"){e.preventDefault();redo();return;}
    if(key==="s"){e.preventDefault();saveFile();return;}
    if(key==="o"){e.preventDefault();pickOpen("append");return;}
    if(key==="d"){e.preventDefault();duplicateSel();return;}
    if(key==="0"){e.preventDefault();fitView();return;}
    if(key==="="||key==="+"){e.preventDefault();zoomAt(innerWidth/2,innerHeight/2,S.cam.z*1.25);return;}
    if(key==="-"){e.preventDefault();zoomAt(innerWidth/2,innerHeight/2,S.cam.z/1.25);return;}
    if(key==="a"){e.preventDefault();S.sel=new Set([...IT.keys()].filter(id=>{const it=IT.get(id);return it.t!=="node"||isVisible(it);}));refreshSelClasses();return;}
    return;
  }
  if(e.key==="Escape"){
    if(S.lens.on){exitLens();return;}
    if(S.tool==="connect"){S.connectA=null;gTemp.innerHTML="";setTool("select");return;}
    if(S.tool==="pen"||S.tool==="eraser"){setTool("select");return;}
    hideMenu();closeDialogs();
    selectOnly(null);
    return;
  }
  if(e.key==="Delete"||e.key==="Backspace"){
    e.preventDefault();
    if(S.selEdge){ED.delete(S.selEdge);S.selEdge=null;pushHistory();render();return;}
    if(S.sel.size){removeItems([...S.sel]);pushHistory();render(true);}
    return;
  }
  const single=S.sel.size===1?IT.get([...S.sel][0]):null;
  if(single&&single.t==="node"){
    if(e.key==="Tab"){e.preventDefault();addChild(single.id);pushHistory();return;}
    if(e.key==="Enter"){e.preventDefault();single.p?(addSibling(single.id),pushHistory()):(addChild(single.id),pushHistory());return;}
    if(e.key==="F2"){e.preventDefault();startEdit(single.id,true);return;}
    if(e.key.startsWith("Arrow")){
      e.preventDefault();
      let next=null;
      if(e.key==="ArrowLeft")next=single.p;
      else if(e.key==="ArrowRight"){if(single.collapsed){single.collapsed=false;render(true);}next=single.ch[0];}
      else{
        if(single.p){
          const sibs=IT.get(single.p).ch,i=sibs.indexOf(single.id);
          next=e.key==="ArrowUp"?sibs[i-1]:sibs[i+1];
        }
      }
      if(next&&IT.has(next)){selectOnly(next);ensureInView(IT.get(next));}
      return;
    }
  }
  if(single&&(single.t==="note")&&e.key==="F2"){e.preventDefault();startEdit(single.id);return;}
  const toolKeys={v:()=>setTool("select"),h:()=>setTool("hand"),m:()=>showInsertMenu(),
    t:()=>insertNote(),i:()=>$("#fileImg").click(),l:()=>setTool("connect"),
    p:()=>$("#bP").onclick(),e:()=>setTool(S.tool==="eraser"?"select":"eraser"),
    k:()=>insertTodo(),
    w:()=>showFlowMenu(),
    z:()=>S.lens.on?exitLens():enterLens()};
  if(toolKeys[key]){e.preventDefault();toolKeys[key]();return;}
  if(key==="?"||key==="？")toggleHelp();
});

function ensureInView(it){
  const p1=toScreen(it.x,it.y),p2=toScreen(it.x+it.w,it.y+it.h);

  if(p1.x<M)dx=M-p1.x;else if(p2.x>innerWidth-M)dx=innerWidth-M-p2.x;

function applyInkToSel(){   // 选中笔迹时改色/改粗细即时生效
  const ids=[...S.sel].filter(id=>IT.get(id)&&IT.get(id).t==="ink");
  if(!ids.length)return;
  const cfg=curInk();
  if(cfg.hl===false&&S.ink.mode==="er")return;
  for(const id of ids){
    const it=IT.get(id);
    it.color=cfg.color;it.sw=cfg.sw;it.hl=cfg.hl;
    const bb=inkBBox(it.pts,it.sw);
    it.x+=bb.x-it.ox;it.y+=bb.y-it.oy;
    it.ox=bb.x;it.oy=bb.y;it.w=bb.w;it.h=bb.h;
    it.d=inkPath(it.pts,it.sw,it.hl);
  }
  pushHistory();render(true);
}

function makeEdge(from,to,keepMode){
  if(!from||!to)return null;
  const self=from.id===to.id&&(from.rid||null)===(to.rid||null);
  const fa=IT.get(from.id),fb=IT.get(to.id);
  if(self&&!fa)return null;
  const flow=(fa&&fa.t==="shape")||(fb&&fb.t==="shape");
  const ed={id:uid("e"),a:from.id,b:to.id,color:flow?"#94A3B8":"#64748B",label:""};
  if(self){ed.st="loop";ed.solid=1;}
  else if(flow){ed.st=(fa&&fb&&fa.t==="shape"&&fb.t==="shape"&&isBackEdge(fa,fb))?"loop":"ortho";ed.solid=1;}
  if(from.rid)ed.ar=from.rid;
  if(to.rid)ed.br=to.rid;
  ED.set(ed.id,ed);
  S.connectA=null;gTemp.innerHTML="";
  pushHistory();drawFree();
  if(keepMode)toast("已连线 · 继续点击两个对象可再建连线");
  else{
    setTool("select");S.selEdge=ed.id;refreshSelClasses();
    toast(ed.st==="loop"
      ? (self?"已创建自循环 · 双击可加标签（如「重试」）· 工具栏可换边"
             :"已创建回环箭头 · 绕到一侧走回去 · 双击可加标签（如「否」）")
      : "已建立连线 · 双击连线可加标签");
  }
  return ed;
}

/* Markdown 复选框清单 → 任务清单 */
function parseChecklist(txt){
  const lines=String(txt).replace(/\r/g,"").split("\n");
  const rows=[];let title=null,sub=null,any=false;
  for(const raw of lines){
    const line=raw.replace(/\u00A0/g," ");
    const m=/^\s*(?:[-*+]|\d+[.)])\s*\[([ xX✓√])\]\s*(.*)$/.exec(line);
    if(m){
      any=true;
      let body=m[2].trim();
      let g="";
      const tm=/\s*[（(\[【]\s*(MUST|必做|建议|可选|重要|进行中|已完成|待定|P0|P1|P2)\s*[）)\]】]\s*$/i.exec(body);
      if(tm){g=tm[1].toUpperCase()==="MUST"?"MUST":tm[1];body=body.slice(0,tm.index).trim();}
      else{
        const bm=/^\*\*(.+?)\*\*\s*(.*)$/.exec(body);
        if(bm){body=bm[1].trim()+(bm[2]?" "+bm[2].trim():"");}
      }
      let t=body,d="";
      const sp=/^(.+?)[:：]\s*(.+)$/.exec(body);
      if(sp&&sp[1].trim().length<=16&&sp[2].trim().length>=6){t=sp[1].trim();d=sp[2].trim();}
      rows.push({t,th:escapeToHtml(t),d,dh:escapeToHtml(d),g,k:/[xX✓√]/.test(m[1])});
      continue;
    }
    if(!any&&line.trim()){
      const h=line.replace(/^#+\s*/,"").trim();
      if(!title)title=h;else if(!sub)sub=h;
    }else if(any&&/^\s{2,}\S/.test(raw)&&rows.length){
      const extra=raw.trim().replace(/^[-*+]\s*/,"");
      const last=rows[rows.length-1];
      last.d=last.d?last.d+" "+extra:extra;
      last.dh=escapeToHtml(last.d);
    }
  }
  return any?{rows,title,sub}:null;
}

function ingestImageFile(file,cx,cy){
  if(!file||!file.type.startsWith("image/"))return;
  const rd=new FileReader();
  rd.onload=()=>{
    const img=new Image();
    img.onload=()=>{
      let url=rd.result;
      let {width:w,height:h}=img;
      if(Math.max(w,h)>1600){ // 压缩超大图
        const sc=1600/Math.max(w,h);
        const cv=document.createElement("canvas");
        cv.width=Math.round(w*sc);cv.height=Math.round(h*sc);
        cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height);
        url=cv.toDataURL("image/jpeg",0.87);
        w=cv.width;h=cv.height;
      }
      addImageFromDataURL(url,w,h,cx,cy);
    };
    img.src=rd.result;
  };
  rd.readAsDataURL(file);
}
