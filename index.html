/* ============================================================
   树形文本解析器（│├└─ / 缩进 / Markdown 列表）
   ============================================================ */
function parseTreeText(txt){
  const INDENT=new Set([" ","\t","│","├","└","┌","┼","┬","┴","┤","─","|","•","·","◦","*","-","+","`","~","　","▏","›",">"]);
  const items=[];
  for(const raw of String(txt).replace(/\r/g,"").split("\n")){
    if(!raw.trim())continue;
    let i=0;
    while(i<raw.length&&INDENT.has(raw[i]))i++;
    let content=raw.slice(i).trim();
    content=content.replace(/^#+\s+/,"");
    if(!content)continue;
    let w=0;
    for(let k=0;k<i;k++){const c=raw[k];w+=c==="\t"?4:c==="　"?2:1;}
    items.push({w,content});
  }
  if(!items.length)return null;
  const roots=[],stack=[];
  for(const it of items){
    while(stack.length&&it.w<=stack[stack.length-1].w)stack.pop();
    const n={text:it.content,children:[]};
    if(!stack.length)roots.push(n);
    else stack[stack.length-1].node.children.push(n);
    stack.push({w:it.w,node:n});
  }
  return roots;
}
function buildTreeItems(spec,x,y){ // spec: {text,children}
  const root=mkNode(spec.text,null,x,y);
  (function grow(sp,pid){
    for(const c of sp.children){
      const n=mkNode(c.text,pid);
      grow(c,n.id);
    }
  })(spec,root.id);
  return root;
}
function importTreeText(txt){
  const roots=parseTreeText(txt);
  if(!roots||!roots.length){toast("没有解析到有效的树形结构");return false;}
  const before=contentBBox();          // 已有内容 → 放到其下方，避免重叠
  const c=viewCenterW();
  const made=[];
  let y=c.y;
  for(const sp of roots){
    made.push(buildTreeItems(sp,c.x,y));
    y+=120;
  }
  selectOnly(made[0].id);
  render(true);
  const ids=made.flatMap(rt=>subtreeIds(rt.id));
  let x1=1/0,y1=1/0,x2=-1/0,y2=-1/0;
  for(const id of ids){
    const n=IT.get(id);
    x1=Math.min(x1,n.x);y1=Math.min(y1,n.y);x2=Math.max(x2,n.x+n.w);y2=Math.max(y2,n.y+n.h);
  }
  let tx,ty; // 目标：新树包围盒左上角
  if(before){tx=before.x;ty=before.y+before.h+110;}
  else{tx=c.x-(x2-x1)/2;ty=c.y-(y2-y1)/2;}
  const dx=tx-x1,dy=ty-y1;
  for(const rt of made){rt.x+=dx;rt.y+=dy;}
  render(true);
  pushHistory();
  // 视角移动到新树
  const bw=x2-x1,bh=y2-y1;
  const z=clamp(Math.min((innerWidth-160)/bw,(innerHeight-220)/bh,1),0.08,1);
  animateCam((innerWidth-bw*z)/2-tx*z,(innerHeight-bh*z)/2-ty*z,z);
  toast(`已生成导图：${ids.length} 个主题`);
  return true;
}

│

│
├─ 第二层：自我改进闭环（主角 · 全是经典思想，没有神经网络）
│   ├─ 搜索策略：贪心爬山（≈ (1+1) 进化策略，一轮一个候选）
│   ├─ 变异算子：漏斗诊断 + 定向变异

│   │   └─ 乘性步长推旋钮（1–3 个/轮；到边界 → fallback 阶梯）
│   ├─ 选择算子：keep-if-better（Δ ≥ 0.02 margin = 同 seed 噪声上界）
│   ├─ 加速机制：warm-start（分支从父权重续训 → 6min/假设）
│   ├─ 方差控制：固定 seed 配对评估（同卷比较，归因于策略非运气）
│   └─ 终止条件：plateau 早停（连续 3 轮无提升）
│
└─ 第三层：蒸馏轨道 Track B（复刻机 · 监督学习）
    └─ 行为克隆 BC

            └─ 因果 Transformer（3 层自注意力，语义 token + 位置编码）`;

const MMW=176,MMH=118;
let mmMap=null;
function drawMinimap(){
  const dpr=devicePixelRatio||1;
  if(minimap.width!==MMW*dpr){minimap.width=MMW*dpr;minimap.height=MMH*dpr;minimap.style.width=MMW+"px";minimap.style.height=MMH+"px";}
  const c=mmCtx;
  c.setTransform(dpr,0,0,dpr,0,0);
  c.clearRect(0,0,MMW,MMH);
  const bb=contentBBox();
  if(!bb){mmMap=null;return;}
  const pad=60;
  const bx=bb.x-pad,by=bb.y-pad,bw=bb.w+pad*2,bh=bb.h+pad*2;
  const sc=Math.min(MMW/bw,MMH/bh);
  const ox=(MMW-bw*sc)/2,oy=(MMH-bh*sc)/2;
  mmMap={bx,by,sc,ox,oy};
  for(const it of IT.values()){
    if(it.t==="node"&&!isVisible(it))continue;
    const x=ox+(it.x-bx)*sc,y=oy+(it.y-by)*sc;
    const w=Math.max(2,it.w*sc),h=Math.max(1.6,it.h*sc);
    c.fillStyle=it.t==="node"?(depthOf(it)===0?INK:hexA(branchColor(it),.85))
      :it.t==="note"?"#C7CEDB":it.t==="todo"?"#B9C2D4"
      :it.t==="shape"?hexA(shapeColor(it).bd,.8):it.t==="lane"?"#E3E8F2"
      :it.t==="ink"?hexA(it.color,.75):"#A5AEBF";
    c.beginPath();
    c.roundRect?c.roundRect(x,y,w,h,1.5):c.rect(x,y,w,h);
    c.fill();
  }
  // 视口
  const a=toWorld(0,0),b=toWorld(innerWidth,innerHeight);
  c.strokeStyle="#4F46E5";c.lineWidth=1.5;
  c.strokeRect(ox+(a.x-bx)*sc,oy+(a.y-by)*sc,(b.x-a.x)*sc,(b.y-a.y)*sc);
}
function mmJump(e){
  if(!mmMap)return;
  const r=minimap.getBoundingClientRect();
  const wx=(e.clientX-r.left-mmMap.ox)/mmMap.sc+mmMap.bx;
  const wy=(e.clientY-r.top-mmMap.oy)/mmMap.sc+mmMap.by;
  S.cam.x=innerWidth/2-wx*S.cam.z;
  S.cam.y=innerHeight/2-wy*S.cam.z;
  applyCam();updateCtxbar();
}
let mmDrag=false;
minimap.addEventListener("pointerdown",e=>{e.stopPropagation();mmDrag=true;minimap.setPointerCapture(e.pointerId);mmJump(e);});
minimap.addEventListener("pointermove",e=>{if(mmDrag)mmJump(e);});
minimap.addEventListener("pointerup",()=>mmDrag=false);

function download(name,blobOrURL){
  const a=document.createElement("a");
  if(typeof blobOrURL==="string")a.href=blobOrURL;
  else a.href=URL.createObjectURL(blobOrURL);
  a.download=name;
  document.body.appendChild(a);a.click();a.remove();
  if(typeof blobOrURL!=="string")setTimeout(()=>URL.revokeObjectURL(a.href),4000);
}
function stamp(){
  const d=new Date(),p=n=>String(n).padStart(2,"0");
  return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}`;
}
const fnSafe=s=>String(s||"").replace(/[\\/:*?"<>|]/g,"_").slice(0,40)||"画布";

function exportOutline(){
  const lines=[];
  for(const it of IT.values()){
    if(it.t!=="node"||it.p)continue;
    if(lines.length)lines.push("");
    lines.push(plainMath(it.text).replace(/\n/g," "));
    (function walk(n,prefix){
      const kids=n.ch.map(id=>IT.get(id)).filter(Boolean);
      kids.forEach((k,i)=>{
        const last=i===kids.length-1;
        lines.push(prefix+(last?"└─ ":"├─ ")+plainMath(k.text).replace(/\n/g," "));
        walk(k,prefix+(last?"    ":"│   "));
      });
    })(it,"");
  }
  if(!lines.length){toast("画布上还没有思维导图");return;}
  const txt=lines.join("\n");
  download(`无界思维-${curSheetName()}-大纲-${stamp()}.txt`,new Blob([txt],{type:"text/plain;charset=utf-8"}));
  if(navigator.clipboard)navigator.clipboard.writeText(txt).catch(()=>{});
  toast("已导出大纲文本（并复制到剪贴板）");
}

/* PNG：原生 Canvas 渲染（避免 foreignObject 污染画布） */
const FONT_STACK='-apple-system,BlinkMacSystemFont,"PingFang SC","Segoe UI","Microsoft YaHei",sans-serif';
function rr(c,x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  c.beginPath();
  c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);
  c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath();
}
function wrapLines(c,text,maxW){
  const out=[];
  const CJK=/[⺀-鿿豈-﫿＀-｠　-〿]/;
  for(const para of String(text).split("\n")){
    if(!para){out.push("");continue;}
    // 分词：CJK 逐字，拉丁按词
    const toks=para.match(/[⺀-鿿豈-﫿＀-｠　-〿]|\s+|[^\s⺀-鿿豈-﫿＀-｠　-〿]+/g)||[para];
    let line="";
    for(const tk of toks){
      const t=line+tk;
      if(c.measureText(t).width<=maxW||!line){ // 行首 token 即便超宽也放入，后面按字符拆
        if(!line&&c.measureText(tk).width>maxW&&!CJK.test(tk)&&tk.trim()){
          let seg="";
          for(const ch of tk){
            if(c.measureText(seg+ch).width>maxW&&seg){out.push(seg);seg=ch;}
            else seg+=ch;
          }
          line=seg;continue;
        }
        line=t;
      }else{
        out.push(line.replace(/\s+$/,""));
        line=tk.trim()?tk:"";
        if(c.measureText(line).width>maxW&&!CJK.test(line)){
          let seg="";
          for(const ch of line){
            if(c.measureText(seg+ch).width>maxW&&seg){out.push(seg);seg=ch;}
            else seg+=ch;
          }
          line=seg;
        }
      }
    }
    out.push(line.replace(/\s+$/,""));
  }
  return out;
}
function fitTextBox(c,text,boxW,boxH,padX,padY,fs,lh,weight){
  const maxW=boxW-padX*2, maxH=boxH-padY*2;
  let size=fs,lines;
  for(let i=0;i<9;i++){
    c.font=`${weight>=500?weight+" ":""}${size}px ${FONT_STACK}`;
    lines=wrapLines(c,text,maxW);
    if(lines.length*lh*size<=maxH+0.8)return {size,lines,h:boxH};
    if(size<=fs*0.72)break;
    size=Math.max(fs*0.72,size-0.6);
  }
  c.font=`${weight>=500?weight+" ":""}${size}px ${FONT_STACK}`;
  lines=wrapLines(c,text,maxW);
  return {size,lines,h:Math.max(boxH,Math.ceil(lines.length*lh*size+padY*2))}; // 仍装不下 → 加高
}
function drawFitted(c,x,y,padX,padY,fit,lh,color){

async function drawSceneToCanvas(scale){
  const bb=contentBBox();
  if(!bb)return null;
  const pad=70,X=bb.x-pad,Y=bb.y-pad,W=bb.w+pad*2,H=bb.h+pad*2;
  const sc=Math.min(scale,5200/Math.max(W,H));
  const cv=document.createElement("canvas");
  cv.width=Math.round(W*sc);cv.height=Math.round(H*sc);
  const c=cv.getContext("2d");
  c.scale(sc,sc);c.translate(-X,-Y);
  c.fillStyle="#FFFFFF";c.fillRect(X,Y,W,H);
  // 导图分支
  for(const it of IT.values()){
    if(it.t!=="node"||!isVisible(it)||it.collapsed)continue;
    for(const cid of it.ch){
      const ch=IT.get(cid);if(!ch)continue;
      c.strokeStyle=branchColor(ch);
      c.lineWidth=Math.max(1.4,2.9-0.5*depthOf(ch));
      c.lineCap="round";
      c.stroke(new Path2D(branchPath(it,ch)));
    }
  }
  // 自由连线
  for(const e of ED.values()){
    if(!edgeVisible(e))continue;
    const g=geomOf(e);
    c.strokeStyle=e.color;c.lineWidth=1.8;c.lineJoin="round";
    if(!e.solid)c.setLineDash([7,5]);
    c.stroke(new Path2D(g.d));
    c.setLineDash([]);
    const [,,p2,p3]=g.pts;
    const ang=Math.atan2(p3.y-p2.y,p3.x-p2.x);
    c.fillStyle=e.color;
    c.beginPath();
    c.moveTo(p3.x,p3.y);
    c.lineTo(p3.x-9.5*Math.cos(ang-0.4),p3.y-9.5*Math.sin(ang-0.4));
    c.lineTo(p3.x-9.5*Math.cos(ang+0.4),p3.y-9.5*Math.sin(ang+0.4));
    c.closePath();c.fill();
    if(e.label){
      c.font=`600 11.5px ${FONT_STACK}`;
      c.textAlign="center";c.textBaseline="middle";
      c.lineWidth=4;c.strokeStyle="#FFFFFF";c.lineJoin="round";
      c.strokeText(e.label,g.mid.x,g.mid.y);
      c.fillStyle=e.color;c.fillText(e.label,g.mid.x,g.mid.y);
      c.textAlign="left";
    }
  }
  for(const it of IT.values())if(it.t==="lane")drawLaneCanvas(c,it);   // 泳道置底
  // 图片预载
  const imgs=new Map();
  await Promise.all([...IT.values()].filter(i=>i.t==="pic").map(i=>new Promise(res=>{
    const im=new Image();
    im.onload=()=>{imgs.set(i.id,im);res();};
    im.onerror=()=>res();
    im.src=S.assets.get(i.aid)||"";
  })));
  // 对象
  for(const it of IT.values()){
    if(it.t==="node"&&!isVisible(it))continue;
    if(it.t==="ink")continue;
    if(it.t==="pic"){
      const im=imgs.get(it.id);
      rr(c,it.x,it.y,it.w,it.h,10);
      c.fillStyle="#fff";c.fill();
      c.strokeStyle="#E6EAF2";c.lineWidth=1;c.stroke();
      if(im){
        c.save();rr(c,it.x+3,it.y+3,it.w-6,it.h-6,7);c.clip();
        c.drawImage(im,it.x+3,it.y+3,it.w-6,it.h-6);
        c.restore();
      }
      continue;
    }
    if(it.t==="lane")continue;
    if(it.t==="shape"){drawShapeCanvas(c,it);continue;}
    if(it.t==="todo"){drawTodoCanvas(c,it);continue;}
    if(it.t==="note"){
      const fs=it.fs||14.5;
      const isLink=noteIsLink(it);
      const body=isLink?((it.ltitle?it.ltitle+"\n":"")+it.text):plainMath(it.text);
      const fit=fitTextBox(c,body,it.w,it.h,15,13,fs,1.65,400);
      const linkColor=isLink?"#2563EB":null;
      const bg=NOTE_BGS[it.bg||0];
      if(bg!=="transparent"){
        rr(c,it.x,it.y,it.w,fit.h,11);
        c.fillStyle=bg;c.fill();
        c.strokeStyle="#E6EAF2";c.lineWidth=1;c.stroke();
      }
      drawFitted(c,it.x,it.y,15,13,fit,1.65,linkColor||"#334155");
      continue;
    }
    const d=depthOf(it),col=branchColor(it);
    const padX=d===0?18:13,padY=d===0?10:7;
    const fs=d===0?15:d===1?13.5:13,fw=d===0?600:d===1?500:400;
    const fit=fitTextBox(c,plainMath(it.text),it.w+2,it.h,padX,padY,fs,1.5,fw);
    rr(c,it.x,it.y,it.w,fit.h,d===0?11:9);
    if(d===0){c.fillStyle=it.colO!=null?PAL[it.colO%PAL.length]:INK;c.fill();}
    else if(d===1){c.fillStyle=col;c.fill();}
    else{
      c.fillStyle="#fff";c.fill();
      c.strokeStyle=hexA(col,.45);c.lineWidth=1.4;c.stroke();
    }
    drawFitted(c,it.x,it.y,padX,padY,fit,1.5,d<=1?"#FFFFFF":"#28354A");
  }
  // 手写墨迹：最上层（荧光笔用正片叠底，文字仍可见）
  for(const it of IT.values()){
    if(it.t!=="ink")continue;
    c.save();
    c.translate(it.x-it.ox,it.y-it.oy);
    c.fillStyle=it.color;
    if(it.hl){c.globalAlpha=.38;c.globalCompositeOperation="multiply";}
    c.fill(new Path2D(it.d||inkPath(it.pts,it.sw,it.hl)));
    c.restore();
  }
  return cv;
}

const AS={key:"infinimind:"+location.pathname,db:null,ok:false,t:null,warned:false};
function idbOpen(){return new Promise((res,rej)=>{try{
  const rq=indexedDB.open("infinimind",1);
  rq.onupgradeneeded=()=>{try{rq.result.createObjectStore("kv");}catch(_){}};
  rq.onsuccess=()=>res(rq.result);
  rq.onerror=()=>rej(rq.error);

}catch(e){rej(e);}});}
function idbPut(db,k,v){return new Promise((res,rej)=>{try{
  const tx=db.transaction("kv","readwrite");

}catch(e){rej(e);}});}
function idbGet(db,k){return new Promise((res,rej)=>{try{
  const tx=db.transaction("kv","readonly");
  const rq=tx.objectStore("kv").get(k);
  rq.onsuccess=()=>res(rq.result);rq.onerror=()=>rej(rq.error);
}catch(e){rej(e);}});}

/* ---------- 修改发生 ---------- */
function fsDirty(){
  if(FS.loading)return;
  const d=fsSig(serializeProject())!==FS.savedSig;
  if(d===FS.dirty&&!d)return;
  FS.dirty=d;
  if(!d){clearTimeout(FS.t);fsUI();return;}
  if(fsCanWrite()){
    if(FS.state!=="offline"&&FS.state!=="err"){fsUI("dirty");clearTimeout(FS.t);FS.t=setTimeout(fsSave,FS_DELAY);}
    return;
  }
  fsUI();
  // 本地：已关联但这次打开还没授权 → 趁这次操作的用户手势顺手请求一次
  if(FS.kind==="local"&&FS.handle&&!FS.asked&&navigator.userActivation&&navigator.userActivation.isActive){FS.asked=true;fsEnable();}
}

    }
    const f=await FS.handle.getFile();
    return {text:await f.text(),stamp:f.lastModified};
  },
  async write(text){
    if(FS.kind==="drive")return drvWrite(text);
    const w=await FS.handle.createWritable();      // Chrome 先写临时文件，close 时整体替换
    try{await w.write(text);await w.close();}
    catch(e){try{await w.abort();}catch(_){}throw e;}
    return (await FS.handle.getFile()).lastModified;
  },
};

/* ---------- 写回 ---------- */
async function fsSave(force){
  if(!fsCanWrite())return;
  if(FS.busy){FS.again=true;return;}
  if(!FS.dirty&&!force)return;
  clearTimeout(FS.t);FS.busy=true;FS.again=false;fsUI("saving");
  let wait=FS_DELAY;
  try{
    const {text:html}=await BK.load();
    const ex=fsExtract(html);
    if(!ex)throw Object.assign(new Error("文件里找不到工程数据区"),{name:"NoBlock"});
    const disk=fsDisk(ex);
    const proj=buildProject();
    if(disk&&disk.savedAt>FS.base&&fsSig(disk.project)!==fsSig(proj)){
      const mine=confirm(
        `「${fsName()}」已在别处被更新（${disk.device||"其他设备"} · ${fsTime(disk.savedAt)}），比本页打开时的版本新。\n\n`+
        `确定 = 用本页的内容覆盖（文件里那份另存为 .json 下载）\n取消 = 放弃本页修改，换成文件里的新版本（本页这份另存为 .json 下载）`);
      if(!mine){fsBackup(proj,"本页未保存副本");fsAdopt(disk,"已换成文件里的新版本 · 本页内容已另存为 .json");return;}
      fsBackup(disk.project,"被覆盖的版本");
    }
    const rec={app:"InfiniMind",savedAt:Date.now(),device:fsDevice(),project:proj};
    FS.stamp=await BK.write(html.slice(0,ex.i)+fsSer(rec)+html.slice(ex.j));
    FS.base=rec.savedAt;FS.savedSig=fsSig(proj);FS.retry=0;
    FS.dirty=fsSig(serializeProject())!==FS.savedSig;   // 保存期间又改了就继续排队
    fsUI();scheduleAutosave();
  }catch(e){
    const n=e&&e.name,first=!FS.retry;
    (n==="Auth"||e instanceof TypeError?console.warn:console.error)("[无界思维] 保存失败",e);
    FS.retry=Math.min((FS.retry||4000)*2,60000);wait=FS.retry;
    if(n==="Auth"){fsUI("auth");}
    else if(n==="NotAllowedError"||n==="SecurityError"){FS.ready=false;fsUI("perm");}
    else if(n==="NotFoundError"){
      FS.ready=false;
      if(FS.kind==="drive"){DRV.fileId="";lsSet("im-drive-last",null);}
      fsUI("missing");toast(FS.kind==="drive"?"Drive 里找不到这个文件了（可能已删除）· 修改还在本浏览器里":"找不到原文件（可能被移动或改名）· 点右下角重新关联");
    }
    else if(n==="Forbidden"){DRV.canEdit=false;fsUI("ro");toast("没有写入这个文件的权限（可能是只读共享）· 修改先存在本浏览器里");}
    else if(n==="NoBlock"){fsUI("missing");toast("文件里没有无界思维数据区 · 请重新选择");}
    else if(e instanceof TypeError||navigator.onLine===false){fsUI("offline");}
    else{fsUI("err");if(first)toast("保存失败："+((e&&e.message)||e)+" · 稍后自动重试");}
  }finally{
    FS.busy=false;
    if(fsCanWrite()&&(FS.dirty||FS.again)){clearTimeout(FS.t);FS.t=setTimeout(fsSave,wait);}
  }
}
/* 载入别处保存的版本；first = 刚打开，不留撤销记录 */
function fsAdopt(rec,msg,first){
  const prev=hist.last,keep=new Map(S.assets);
  FS.loading=true;
  try{finishEdit(true);loadProject(rec.project);}finally{FS.loading=false;}
  for(const [k,v] of keep)if(!S.assets.has(k))S.assets.set(k,v);
  if(first){hist.un.length=0;}
  else if(prev){hist.un.push(prev);if(hist.un.length>80)hist.un.shift();}
  hist.re.length=0;hist.last=JSON.stringify(serializeProject());updateUndoBtns();
  FS.base=rec.savedAt||FS.base;FS.savedSig=fsSig(serializeProject());FS.dirty=false;
  scheduleAutosave();fsUI();
  if(msg)toast(msg);
}
/* 拿到文件里的版本后，和本页对齐 */
function fsReconcile(disk,first){
  if(fsSig(disk.project)===fsSig(serializeProject())){
    FS.base=disk.savedAt;FS.savedSig=fsSig(serializeProject());FS.dirty=false;fsUI();scheduleAutosave();return;
  }
  if(!FS.dirty){
    fsAdopt(disk,first?"":`已同步到最新版本（${disk.device||"其他设备"} · ${fsTime(disk.savedAt)}）· ⌘/Ctrl+Z 可退回`,first);
    return;
  }
  if(first){                                  // 打开时本机还有没保存进文件的修改
    if(FS.base===disk.savedAt){fsUI();toast("已恢复本机上次没保存进文件的修改");return;}
    const takeFile=confirm(
      `本机有一份没保存进文件的修改，但文件已在别处更新（${disk.device||"其他设备"} · ${fsTime(disk.savedAt)}）。\n\n`+
      `确定 = 用文件里的新版本（本机这份另存为 .json 下载）\n取消 = 继续用本机这份修改`);
    if(takeFile){fsBackup(buildProject(),"本机未保存副本");fsAdopt(disk,"",true);}
    else{FS.base=disk.savedAt;fsUI();toast("已保留本机的修改 · 保存后会覆盖文件里的版本");}
    return;
  }
  if(FS.dismissed!==disk.savedAt){FS.dismissed=disk.savedAt;toast("文件已在别处更新，本页也有未保存的修改 · 保存时会让你选保留哪一份");}
}
/* 回到页面时看看文件是不是被别的设备更新了 */
async function fsCheckExternal(){
  if(FS.busy)return;
  if(FS.kind==="drive"?!(DRV.fileId&&DRV.token):!FS.handle)return;
  try{
    if(FS.kind==="local"&&(await FS.handle.queryPermission({mode:"read"}))!=="granted")return;
    const st=await BK.peek();
    if(FS.stamp!=null&&st===FS.stamp)return;
    const {text,stamp:s2}=await BK.load();
    FS.stamp=s2;
    const disk=fsDisk(fsExtract(text));
    if(!disk||!(disk.savedAt>FS.base))return;
    fsReconcile(disk,false);
  }catch(e){if(e&&e.name==="Auth")fsUI("auth");}
}

/* ---------- 本地文件：关联 / 授权 ---------- */
async function fsBind(){
  if(FS.kind==="drive"){drvPick();return;}
  if(!FS.support){toast("这个浏览器不能写回文件，已改为导出 .json");saveJSON();return;}
  let h;
  try{[h]=await window.showOpenFilePicker({id:"infinimind",
    types:[{description:"无界思维 HTML",accept:{"text/html":[".html",".htm"]}}]});}
  catch(e){if(!e||e.name!=="AbortError")toast("无法打开文件选择："+((e&&e.message)||e));return;}
  const self=fsSelf();
  if(self&&h.name!==self&&!confirm(`你选的是「${h.name}」，当前打开的是「${self}」。\n\n确定要把工程保存进「${h.name}」吗？`))return;
  let ex=null;
  try{ex=fsExtract(await (await h.getFile()).text());}catch(_){}
  if(!ex){toast("这个文件里没有工程数据区 · 请选中当前这个无界思维 HTML 本身");return;}
  FS.handle=h;FS.ready=false;FS.asked=true;FS.stamp=null;
  try{if(AS.db)await idbPut(AS.db,FS_KEY,h);}catch(_){}
  try{FS.ready=(await h.requestPermission({mode:"readwrite"}))==="granted";}catch(_){FS.ready=false;}
  if(!FS.ready){fsUI("perm");toast("已关联「"+h.name+"」· 再点一下右下角，允许写入即可");return;}
  toast(`已关联「${h.name}」· 之后的修改会自动写回这个文件`);
  fsSave(true);
}
async function fsEnable(){
  if(!FS.handle){fsBind();return;}
  FS.asked=true;
  let r="denied";
  try{r=await FS.handle.requestPermission({mode:"readwrite"});}
  catch(e){if(e&&e.name==="NotFoundError"){fsUI("missing");return;}}
  FS.ready=r==="granted";
  if(!FS.ready){fsUI("perm");return;}
  await fsCheckExternal();
  if(FS.dirty)fsSave();else fsUI();
}

/* ---------- Google Drive ---------- */
async function drvFetch(url,opt){
  opt=opt||{};
  if(!DRV.token||Date.now()>DRV.exp-20e3){DRV.token="";throw Object.assign(new Error("需要重新连接 Google Drive"),{name:"Auth"});}
  const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:"Bearer "+DRV.token}});
  if(r.ok)return r;
  let msg="",reason="";
  try{const j=await r.json();msg=(j.error&&j.error.message)||"";reason=(j.error&&j.error.errors&&j.error.errors[0]&&j.error.errors[0].reason)||"";}catch(_){}
  if(r.status===401){DRV.token="";lsSet("im-drive-token",null);throw Object.assign(new Error("Google 授权已过期"),{name:"Auth"});}
  const rate=/rateLimit|quota/i.test(reason);
  const name=r.status===404?"NotFoundError":(r.status===403&&!rate)?"Forbidden":"HttpError";
  throw Object.assign(new Error(`Drive ${r.status}${msg?"："+msg:""}`),{name,status:r.status});
}
async function drvWrite(text){
  const blob=new Blob([text],{type:"text/html"}),id=encodeURIComponent(DRV.fileId);
  let meta;
  if(blob.size<=5000000){
    const r=await drvFetch(`${DRV_UP}/${id}?uploadType=media&fields=version&supportsAllDrives=true`,
      {method:"PATCH",headers:{"Content-Type":"text/html; charset=UTF-8"},body:blob});
    meta=await r.json();
  }else{                                       // 超过 5MB（图片多）：断点续传上传
    const r0=await drvFetch(`${DRV_UP}/${id}?uploadType=resumable&fields=version&supportsAllDrives=true`,
      {method:"PATCH",headers:{"Content-Type":"application/json; charset=UTF-8","X-Upload-Content-Type":"text/html; charset=UTF-8"},body:"{}"});
    const loc=r0.headers.get("Location");
    if(!loc)throw new Error("Drive 没有返回上传地址");
    const r1=await fetch(loc,{method:"PUT",headers:{"Content-Type":"text/html; charset=UTF-8"},body:blob});
    if(!r1.ok)throw Object.assign(new Error("Drive 上传失败 "+r1.status),{name:r1.status===401?"Auth":"HttpError"});
    meta=await r1.json();
  }
  DRV.text=text;DRV.version=String(meta.version);
  return DRV.version;
}
async function drvCreateFile(name,folderId,text){
  const meta={name,mimeType:"text/html"};if(folderId)meta.parents=[folderId];
  const b="im"+Math.random().toString(36).slice(2);
  const body=new Blob([`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: text/html; charset=UTF-8\r\n\r\n`,text,`\r\n--${b}--`]);
  const r=await drvFetch(`${DRV_UP}?uploadType=multipart&fields=id,name,version&supportsAllDrives=true`,
    {method:"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body});
  return r.json();
}
function drvSetFile(id,name,version,text,canEdit){
  DRV.fileId=id;DRV.name=name||"";DRV.version=String(version);DRV.text=text;DRV.canEdit=canEdit!==false;DRV.opened=true;
  FS.stamp=DRV.version;
  AS.key="infinimind:drive:"+id;lsSet("im-drive-last",id);
  try{history.replaceState(null,"",location.pathname+"?file="+encodeURIComponent(id));}catch(_){}
  document.title=(DRV.name.replace(/\.html?$/i,"")||"无界思维")+" · 无界思维";
}
async function drvInit(){
  fsUI();
  try{await fsLoadScript("config.js?t="+Date.now());}catch(_){}
  const cfg=window.IM_CONFIG||{};
  DRV.cfgOk=/\.apps\.googleusercontent\.com$/.test(String(cfg.clientId||"").trim());
  if(!DRV.cfgOk){fsUI();return;}
  try{
    await fsLoadScript("https://accounts.google.com/gsi/client");
    DRV.tc=google.accounts.oauth2.initTokenClient({client_id:String(cfg.clientId).trim(),scope:DRV_FILE+" "+DRV_INSTALL,
      callback:r=>DRV.onTok&&DRV.onTok(r),error_callback:e=>DRV.onErr&&DRV.onErr(e)});
  }catch(e){fsUI("err");toast("加载 Google 登录组件失败（检查网络）");return;}
  if(DRV.token){fsUI("loading");await drvAfterAuth(false);return;}
  fsUI();
  if(DRV.target)drvGate();
}
/* 必须在点击等用户手势里直接调用（会弹出 Google 授权小窗） */
function drvConnect(){
  if(!DRV.tc){toast(DRV.cfgOk===false?"还没配置 Google 登录（config.js）":"Google 登录组件还在加载，稍等再点");return;}
  if(DRV.authing)return;
  DRV.authing=true;clearTimeout(DRV.authT);
  DRV.authT=setTimeout(()=>{DRV.authing=false;},90e3);
  DRV.onTok=r=>{
    DRV.authing=false;clearTimeout(DRV.authT);
    if(!r||r.error||!r.access_token){fsUI();toast("没有完成 Google 授权");return;}
    if(!google.accounts.oauth2.hasGrantedAllScopes(r,DRV_FILE)){
      fsUI();toast("需要勾选「查看、修改、创建和删除您使用此应用打开或创建的 Google 云端硬盘文件」");return;
    }
    DRV.token=r.access_token;DRV.exp=Date.now()+(+r.expires_in||3600)*1000;DRV.authed=true;
    lsSet("im-drive-token",JSON.stringify({token:DRV.token,exp:DRV.exp}));
    drvAfterAuth(true);
  };
  DRV.onErr=e=>{
    DRV.authing=false;clearTimeout(DRV.authT);fsUI();
    if(!e||e.type!=="popup_closed")toast("Google 授权窗口没能打开（可能被浏览器拦截）· 再点一次右下角");
  };
  try{DRV.tc.requestAccessToken({prompt:"",login_hint:DRV.hint||undefined});}
  catch(e){DRV.authing=false;toast("无法打开 Google 授权："+e.message);}
}
async function drvAfterAuth(interactive){
  drvGateClose();
  if(DRV.fileId){                              // 授权过期后重新连上
    fsUI();await fsCheckExternal();
    if(FS.dirty&&fsCanWrite())fsSave();else fsUI();
    return;
  }
  const tg=DRV.target;DRV.target=null;
  if(tg&&tg.type==="open"){await drvOpen(tg.id,{last:tg.last});return;}
  if(tg&&tg.type==="create"){await drvCreate(tg.folderId);return;}
  fsUI();
  if(interactive)drvPick();
}
async function drvOpen(id,opt){
  opt=opt||{};
  if(!DRV.token){DRV.target={type:"open",id};drvConnect();return;}
  if(DRV.fileId&&DRV.fileId!==id&&FS.dirty&&fsCanWrite())await fsSave();
  fsUI("loading");
  let meta,text;
  try{
    meta=await (await drvFetch(`${DRV_API}/${encodeURIComponent(id)}?fields=id,name,version,capabilities(canEdit)&supportsAllDrives=true`)).json();
    text=await (await drvFetch(`${DRV_API}/${encodeURIComponent(id)}?alt=media&supportsAllDrives=true`)).text();
  }catch(e){
    if(e.name==="Auth"){DRV.target={type:"open",id};fsUI("login");drvGate();return;}
    if(opt.last)lsSet("im-drive-last",null);
    fsUI();
    toast(e.name==="NotFoundError"||e.name==="Forbidden"
      ?"打不开这个文件：没找到，或还没在 Drive 里用「打开方式 → 无界思维」打开过"
      :"从 Drive 打开失败："+e.message);
    return;
  }
  const ex=fsExtract(text);
  if(!ex||(ex.rec&&ex.rec.bad)){
    if(opt.last)lsSet("im-drive-last",null);
    fsUI();toast(`「${meta.name}」不是无界思维工程文件（找不到数据区）`);return;
  }
  const same=!DRV.opened&&("infinimind:drive:"+id)===DRV.bootKey;   // 启动时载入的本机缓存就是这个文件
  if(!same){FS.dirty=false;FS.base=0;FS.savedSig="";}
  drvSetFile(id,meta.name,meta.version,text,!meta.capabilities||meta.capabilities.canEdit!==false);
  const disk=fsDisk(ex);
  if(disk)fsReconcile(disk,true);
  else{FS.base=0;FS.savedSig="";FS.dirty=true;}   // 空数据区（例如模板文件）：把当前画布写进去
  if(!same&&disk)fitView(false);
  fsUI();
  if(FS.dirty&&fsCanWrite()){clearTimeout(FS.t);FS.t=setTimeout(fsSave,FS_DELAY);}
  scheduleAutosave();
}
async function drvCreate(folderId){
  if(!DRV.token){DRV.target={type:"create",folderId};drvConnect();return;}
  let name=prompt("新工程的名字：","新导图");
  if(name==null){fsUI();return;}
  name=(String(name).trim()||"新导图").replace(/\.html?$/i,"").slice(0,80)+".html";
  if(DRV.fileId&&FS.dirty&&fsCanWrite())await fsSave();
  fsUI("loading");
  try{
    const tpl=await (await fetch(location.pathname,{cache:"no-store"})).text();
    const ex=fsExtract(tpl);
    if(!ex)throw new Error("网页模板里没有数据区");
    FS.loading=true;
    try{finishEdit(true);S.assets.clear();loadProject({sheets:[{name:"画布 1",items:[],edges:[]}]});}finally{FS.loading=false;}
    hist.un.length=0;hist.re.length=0;hist.last=JSON.stringify(serializeProject());updateUndoBtns();
    const proj=buildProject();
    const rec={app:"InfiniMind",savedAt:Date.now(),device:fsDevice(),project:proj};
    const text=tpl.slice(0,ex.i)+fsSer(rec)+tpl.slice(ex.j);
    const meta=await drvCreateFile(name,folderId,text);
    drvSetFile(meta.id,meta.name,meta.version,text,true);
    FS.base=rec.savedAt;FS.savedSig=fsSig(proj);FS.dirty=false;
    scheduleAutosave();fsUI();fitView(false);
    toast(`已在 Google Drive 新建「${meta.name}」· 修改会自动保存`);
  }catch(e){
    fsUI();
    toast(e&&e.name==="Auth"?"Google 授权已过期，请再点一次右下角":"新建失败："+((e&&e.message)||e));
  }
}

/* ---------- 启动时恢复 ---------- */
async function fsInit(){
  if(FS.kind==="drive"){drvInit();return;}
  if(!FS.support){fsUI();return;}
  try{if(AS.db)FS.handle=(await idbGet(AS.db,FS_KEY))||null;}catch(_){FS.handle=null;}
  if(!FS.handle){fsUI();return;}
  try{FS.ready=(await FS.handle.queryPermission({mode:"readwrite"}))==="granted";}catch(_){FS.ready=false;}
  if(!FS.ready){fsUI();return;}
  await fsCheckExternal();
  if(FS.dirty)fsSave();else fsUI();
}

/* ---------- 打开工程：追加 / 合并 / 替换 ---------- */
let openMode="append";
const projSheets=p=>{
  const fn=new Map((Array.isArray(p.folders)?p.folders:[]).map(f=>[f.id,f.name]));
  return Array.isArray(p.sheets)&&p.sheets.length
    ? p.sheets.map(sh=>({name:sh.name||"画布",camera:sh.camera||null,
        folder:fn.get(sh.fid)||sh.folder||null,items:sh.items||[],edges:sh.edges||[]}))
    : [{name:"画布",camera:p.camera||null,items:p.items||[],edges:p.edges||[]}];   // 兼容 v1 单画布
};
const PRE={node:"n",note:"t",pic:"p",todo:"d",ink:"k"};
/* 导入时给所有 id 换新，避免和当前工程里的 id 撞车 */
function remapImported(sheets,assets){
  const idMap=new Map(),aidMap=new Map(),ridMap=new Map();
  for(const sh of sheets)for(const it of sh.items){
    if(!it||!it.id)continue;
    idMap.set(it.id,uid(PRE[it.t]||"i"));
    if(it.t==="pic"&&it.aid&&!aidMap.has(it.aid))aidMap.set(it.aid,uid("a"));
    if(it.t==="todo")for(const r of it.rows||[])if(r&&r.id)ridMap.set(r.id,uid("r"));
  }
  for(const sh of sheets){
    sh.items=sh.items.filter(it=>it&&idMap.has(it.id));
    for(const it of sh.items){
      it.id=idMap.get(it.id);
      if(it.t==="node"){
        it.p=it.p&&idMap.has(it.p)?idMap.get(it.p):null;
        it.ch=(it.ch||[]).map(c=>idMap.get(c)).filter(Boolean);
      }
      if(it.t==="pic"&&it.aid)it.aid=aidMap.get(it.aid)||it.aid;
      if(it.t==="todo")for(const r of it.rows||[])if(r&&r.id)r.id=ridMap.get(r.id)||r.id;
    }
    sh.edges=(sh.edges||[])
      .filter(e=>e&&idMap.has(e.a)&&idMap.has(e.b))
      .map(e=>{
        const ne={id:uid("e"),a:idMap.get(e.a),b:idMap.get(e.b),color:e.color||"#64748B",label:e.label||""};
        if(e.ar&&ridMap.has(e.ar))ne.ar=ridMap.get(e.ar);
        if(e.br&&ridMap.has(e.br))ne.br=ridMap.get(e.br);
        return ne;
      });
  }
  const na={};
  for(const k in assets||{})if(aidMap.has(k))na[aidMap.get(k)]=assets[k];
  return na;
}
function uniqueSheetName(nm,fid){
  const used=new Set((fid?SH.list.filter(x=>x.fid===fid):SH.list).map(x=>x.name));
  if(!used.has(nm))return nm;
  let i=2;while(used.has(`${nm} (${i})`))i++;
  return `${nm} (${i})`;
}
function sheetBBox(items){
  let x1=1/0,y1=1/0,x2=-1/0,y2=-1/0;
  for(const it of items){
    const w=+it.w||0,h=+it.h||0;
    x1=Math.min(x1,it.x||0);y1=Math.min(y1,it.y||0);
    x2=Math.max(x2,(it.x||0)+w);y2=Math.max(y2,(it.y||0)+h);
  }
  return x1===1/0?{x:0,y:0,w:0,h:0}:{x:x1,y:y1,w:x2-x1,h:y2-y1};
}
/* 追加：导入的画布作为新的分组标签加在后面 */
function appendProject(sheets,dropEmpty,newFolderName){
  syncActiveSheet();
  ensureFolders();
  let fid=SH.curF;
  if(newFolderName){
    const f={id:uid("fd"),name:uniqueFolderName(String(newFolderName).slice(0,24))};
    SH.folders.push(f);fid=f.id;
  }
  const first=SH.list.length;
  const pick=nm=>{                       // 画布自带文件夹名 → 同名归并，没有就新建
    const k=String(nm).trim().slice(0,24);
    if(!k)return fid;
    let ex=SH.folders.find(x=>x.name===k);
    if(!ex){ex={id:uid("fd"),name:k};SH.folders.push(ex);}
    return ex.id;
  };
  for(const sh of sheets){
    const f=(!newFolderName&&sh.folder)?pick(sh.folder):fid;
    SH.list.push({id:uid("sh"),name:uniqueSheetName(sh.name,f),fid:f,camera:sh.camera,
                  data:{items:sh.items,edges:sh.edges}});
  }
  if(dropEmpty){                       // 工程本来是空的 → 不留下多余的空白标签
    const added=SH.list.slice(first);
    const kept=SH.list.slice(0,first).filter(sh=>((sh.data&&sh.data.items)||[]).length);
    SH.list=[...kept,...added];
    SH.cur=kept.length;
    if(SH.folders.length>1)                       // 顺手清掉被腾空的占位文件夹
      SH.folders=SH.folders.filter(f=>SH.list.some(sh=>sh.fid===f.id))||SH.folders;
    if(!SH.folders.length)SH.folders=[{id:uid("fd"),name:"我的项目"}];
  }else SH.cur=first;
  SH.curF=(SH.list[SH.cur]&&SH.list[SH.cur].fid)||fid;
  ensureFolders();
  applySheet(SH.list[SH.cur]);
  renderSheetbar();
}
/* 合并：导入的内容放到当前画布已有内容的右侧 */
function mergeProject(sheets){
  const cur=serialize();
  const items=[...cur.items],edges=[...cur.edges];
  const bb=contentBBox();
  let offX=bb?bb.x+bb.w+160:0,offY=bb?bb.y:0;
  for(const sh of sheets){
    if(!sh.items.length)continue;
    const sb=sheetBBox(sh.items);
    const dx=offX-sb.x,dy=offY-sb.y;
    for(const it of sh.items){
      it.x=(it.x||0)+dx;it.y=(it.y||0)+dy;   // 墨迹的 ox/oy 保持不变，位移由 x-ox 得出
      items.push(it);
    }
    edges.push(...sh.edges);
    offX+=sb.w+160;
  }
  restore({items,edges});
}
/* ============================================================
   「简化格式」导入：给人 / 给 AI 手写的易读 JSON
   { app:"InfiniMind", format:"simple", sheets:[{ name, items:[...], links:[...] }] }
   items: {type:"mindmap"|"note"|"todo"|"image", ...}
   ============================================================ */
const NOTE_COLOR_NAMES={white:0,none:1,transparent:1,yellow:2,blue:3,green:4,pink:5};
const LINK_COLORS={gray:"#64748B",grey:"#64748B",blue:"#2563EB",orange:"#D97706",red:"#DC2626",green:"#16A34A",purple:"#7C3AED"};
function isSimpleFormat(p){
  if(p.format==="simple"||p.format==="Simple")return true;
  const hasType=arr=>Array.isArray(arr)&&arr.some(o=>o&&typeof o==="object"&&typeof o.type==="string");
  if(hasType(p.items))return true;
  if(Array.isArray(p.sheets)&&p.sheets.some(sh=>sh&&hasType(sh.items)))return true;
  return false;
}
function simpleTreeSpec(o){                       // 支持 tree 字符串 或 {text,children} 对象
  if(typeof o.tree==="string"&&o.tree.trim()){
    const roots=parseTreeText(o.tree);
    return roots&&roots.length?roots[0]:null;
  }
  const src=o.root||o.node||(o.text?o:null);
  if(!src)return null;
  const conv=n=>({text:String(n.text!=null?n.text:n.title||""),
                  children:(n.children||n.nodes||[]).map(conv)});
  return conv(src);
}
function countLeaves(sp){
  if(!sp)return 1;
  if(!sp.children||!sp.children.length)return 1;
  return sp.children.reduce((a,c)=>a+countLeaves(c),0);
}
function buildFromSimple(p){
  const warn=[];
  const rawSheets=Array.isArray(p.sheets)&&p.sheets.length
    ? p.sheets
    : [{name:p.name||p.title||"画布",items:p.items||[],links:p.links||p.edges||[]}];
  const assets={};
  const sheets=rawSheets.map((sh,si)=>{
    const items=[],edges=[];
    const anchor=new Map();                       // 作者写的 id → {itemId, rid}
    const nodeByText=new Map();                   // "导图id/节点文字" → 节点 id
    const textIndex=new Map();                    // 纯文字 → 对象 id（兜底匹配）
    let cursorY=0;
    const list=Array.isArray(sh.items)?sh.items:[];
    /* 先建泳道：后面的 flow 才能按"泳道/阶段"落格子 */
    const laneMap=new Map();
    let laneStackY=0;
    for(const o of list){
      if(!o||typeof o!=="object")continue;
      const tp=String(o.type||"").toLowerCase();
      if(tp!=="swimlane"&&tp!=="lane"&&tp!=="lanes")continue;
      const lanes=(o.lanes||o.rows||["泳道 1","泳道 2"]).map(n=>({id:uid("L"),name:String(typeof n==="string"?n:(n&&n.name)||"")}));
      const cols=(o.cols||o.stages||o.columns||[]).map(n=>({id:uid("C"),name:String(typeof n==="string"?n:(n&&n.name)||"")}));
      const title=String(o.title!=null?o.title:o.name||"工作流泳道");
      const hasXY=typeof o.x==="number"&&typeof o.y==="number";
      const it={id:uid("w"),t:"lane",title,titleHtml:escapeToHtml(title),lanes,cols,
        lh:clamp(+o.lh||+o.rowHeight||150,80,420),w:clamp(+o.w||900,320,2400),
        x:hasXY?o.x:0,y:hasXY?o.y:laneStackY,h:0};
      it.h=laneTotalH(it);
      if(!hasXY)laneStackY+=it.h+60;
      items.push(it);
      if(o.id!=null){anchor.set(String(o.id),{itemId:it.id,rid:null});laneMap.set(String(o.id),it);}
      laneMap.set(it.title,it);
      if(!laneMap.has("*"))laneMap.set("*",it);
      cursorY=Math.max(cursorY,it.y+it.h+60);
    }
    /* 泳道格子 → 坐标 */
    const cellPos=(L,rowRef,colRef,w,h)=>{
      if(!L)return null;
      const ri=Math.max(0,(L.lanes||[]).findIndex(z=>z.name===String(rowRef)||z.id===String(rowRef)));
      const ci=(L.cols&&L.cols.length)?Math.max(0,L.cols.findIndex(z=>z.name===String(colRef)||z.id===String(colRef))):0;
      const hh=laneHeaderH(L),lh=L.lh||150;
      const inner=L.w-LANE_NAME_W,cw=(L.cols&&L.cols.length)?inner/L.cols.length:inner;
      return {x:Math.round(L.x+LANE_NAME_W+ci*cw+(cw-w)/2),
              y:Math.round(L.y+hh+ri*lh+(lh-h)/2)};
    };
    const mkShape=(kind,txt,x,y,o)=>{
      const sk=shapeKind(kind),sp=SHAPES[sk];
      const t=String(txt==null?"":txt);
      const it={id:uid("s"),t:"shape",sh:sk,text:t,html:escapeToHtml(t),
        x,y,w:clamp(+(o&&o.w)||sp.w,90,700),h:sp.minH};
      if(o&&o.color!=null&&+o.color>=0)it.c=+o.color%FLOW_PAL.length;
      items.push(it);
      return it;
    };
    for(let k=0;k<list.length;k++){
      const o=list[k];
      if(!o||typeof o!=="object")continue;
      const type=String(o.type||"").toLowerCase();
      const key=o.id!=null?String(o.id):null;
      const hasXY=typeof o.x==="number"&&typeof o.y==="number";
      const px=hasXY?o.x:0, py=hasXY?o.y:cursorY;
      if(type==="mindmap"||type==="map"||type==="tree"){
        const spec=simpleTreeSpec(o);
        if(!spec){warn.push(`第 ${k+1} 个 mindmap 缺少 tree/root`);continue;}
        const rootId=uid("n");
        const stack=[[spec,null,rootId]];
        while(stack.length){
          const [sp,parent,myId]=stack.shift();
          const it={id:myId,t:"node",text:String(sp.text||"主题"),p:parent,ch:[],
                    x:parent?0:px,y:parent?0:py,collapsed:false};
          items.push(it);
          if(parent){const pn=items.find(z=>z.id===parent);if(pn)pn.ch.push(myId);}
          if(!nodeByText.has(it.text))nodeByText.set(it.text,myId);
          if(key)nodeByText.set(key+"/"+it.text,myId);
          if(!textIndex.has(it.text))textIndex.set(it.text,{itemId:myId,rid:null});
          for(const c of sp.children||[])stack.push([c,myId,uid("n")]);
        }
        if(key)anchor.set(key,{itemId:rootId,rid:null});
        if(!hasXY)cursorY+=Math.max(200,countLeaves(spec)*48+80);
      }else if(type==="note"||type==="text"||type==="textbox"){
        const txt=String(o.text!=null?o.text:o.content||"");
        const bg=typeof o.color==="string"?(NOTE_COLOR_NAMES[o.color.toLowerCase()]??0):(+o.bg||0);
        const it={id:uid("t"),t:"note",text:txt,html:escapeToHtml(txt),
                  x:px,y:py,w:clamp(+o.w||340,150,760),h:60,bg};
        items.push(it);
        if(key)anchor.set(key,{itemId:it.id,rid:null});
        if(!textIndex.has(txt))textIndex.set(txt,{itemId:it.id,rid:null});
        if(!hasXY)cursorY+=Math.max(120,Math.ceil(txt.length/28)*26+80);
      }else if(type==="todo"||type==="checklist"||type==="tasks"){
        const rowsSrc=o.items||o.rows||o.tasks||[];
        const rows=rowsSrc.map(r=>{
          const rr=typeof r==="string"?{text:r}:(r||{});
          const t=String(rr.text!=null?rr.text:rr.title||"");
          const d=String(rr.desc!=null?rr.desc:rr.description||rr.note||"");
          return {id:rowId(),t,th:escapeToHtml(t),d,dh:d?escapeToHtml(d):"",
                  g:String(rr.tag||rr.label||""),k:!!(rr.done||rr.checked||rr.k)};
        });
        const title=String(o.title!=null?o.title:o.name||"任务清单");
        const sub=String(o.sub||o.subtitle||o.desc||"");
        const it={id:uid("d"),t:"todo",title,titleHtml:escapeToHtml(title),
                  sub,subHtml:sub?escapeToHtml(sub):"",rows,
                  x:px,y:py,w:clamp(+o.w||460,300,760),h:180,bg:0};
        items.push(it);
        if(key){
          anchor.set(key,{itemId:it.id,rid:null});
          rows.forEach((r,i)=>{
            anchor.set(`${key}#${i+1}`,{itemId:it.id,rid:r.id});
            if(r.t)anchor.set(`${key}/${r.t}`,{itemId:it.id,rid:r.id});
          });
        }
        rows.forEach(r=>{if(r.t&&!textIndex.has(r.t))textIndex.set(r.t,{itemId:it.id,rid:r.id});});
        if(!hasXY)cursorY+=Math.max(200,rows.length*54+140);
      }else if(type==="link"||type==="url"||type==="bookmark"){
        const url=String(o.url||o.href||o.src||o.text||"").trim();
        if(!safeHref(url)){warn.push(`第 ${k+1} 个 link 的网址无效（需 http/https）`);continue;}
        const it={id:uid("t"),t:"note",text:url,html:escapeToHtml(url),
                  x:px,y:py,w:clamp(+o.w||380,200,760),h:60,bg:0};
        if(o.title||o.name)it.ltitle=String(o.title||o.name).trim();
        items.push(it);
        if(key)anchor.set(key,{itemId:it.id,rid:null});
        if(o.title&&!textIndex.has(String(o.title)))textIndex.set(String(o.title),{itemId:it.id,rid:null});
        if(!textIndex.has(url))textIndex.set(url,{itemId:it.id,rid:null});
        if(!hasXY)cursorY+=120;
      }else if(type==="swimlane"||type==="lane"||type==="lanes"){
        continue;                       // 已在前面建好
      }else if(type==="shape"||type==="block"){
        const txt=String(o.text!=null?o.text:o.title||"");
        const it=mkShape(o.shape||o.kind||o.sh,txt,px,py,o);
        if(key)anchor.set(key,{itemId:it.id,rid:null});
        if(txt&&!textIndex.has(txt))textIndex.set(txt,{itemId:it.id,rid:null});
        if(!hasXY)cursorY+=it.h+60;
      }else if(type==="flow"||type==="flowchart"||type==="workflow"||type==="process"){
        const steps=(o.steps||o.nodes||o.items||[]).filter(Boolean);
        if(!steps.length){warn.push(`第 ${k+1} 个 flow 没有 steps`);continue;}
        const L=o.in!=null?laneMap.get(String(o.in)):(o.lane!=null?laneMap.get(String(o.lane)):laneMap.get("*"))||null;
        const dir=String(o.dir||o.direction||"down").toLowerCase();
        const gapX=+o.gapX||70,gapY=+o.gapY||64;
        const made=[];
        let cx=px,cy=hasXY?py:cursorY;
        for(let i=0;i<steps.length;i++){
          const st=typeof steps[i]==="string"?{text:steps[i]}:steps[i];
          const sk=shapeKind(st.shape||st.kind||st.sh||(i===0?"start":i===steps.length-1?"end":"proc"));
          const sp=SHAPES[sk],w=clamp(+st.w||sp.w,90,700),h=sp.minH;
          let pos=null;
          if(typeof st.x==="number"&&typeof st.y==="number")pos={x:st.x,y:st.y};
          else if(L&&(st.lane!=null||st.row!=null))pos=cellPos(L,st.lane!=null?st.lane:st.row,st.col!=null?st.col:st.stage,w,h);
          if(!pos){pos={x:dir==="right"?cx:px-w/2,y:cy};cy+=h+gapY;if(dir==="right"){cx+=w+gapX;}}
          const it=mkShape(sk,st.text!=null?st.text:st.title||"",Math.round(pos.x),Math.round(pos.y),st);
          made.push(it);
          const sid=st.id!=null?String(st.id):null;
          if(sid){anchor.set(sid,{itemId:it.id,rid:null});if(key)anchor.set(key+"/"+sid,{itemId:it.id,rid:null});}
          if(it.text&&!textIndex.has(it.text))textIndex.set(it.text,{itemId:it.id,rid:null});
          if(key&&it.text)anchor.set(key+"/"+it.text,{itemId:it.id,rid:null});
        }
        if(key)anchor.set(key,{itemId:made[0].id,rid:null});
        if(o.autolink!==false&&o.link!==false){
          for(let i=0;i<made.length-1;i++)
            edges.push({id:uid("e"),a:made[i].id,b:made[i+1].id,color:"#94A3B8",label:"",st:"ortho",solid:1});
        }
        if(!hasXY&&!L)cursorY=cy+40;
      }else if(type==="image"||type==="img"||type==="picture"){
        const src=String(o.src||o.data||o.url||"");
        if(!/^data:image\//.test(src)){warn.push(`第 ${k+1} 个 image 需要 data: 开头的内嵌图片`);continue;}
        const aid=uid("a");assets[aid]=src;
        const w=clamp(+o.w||360,40,1600);
        const it={id:uid("p"),t:"pic",aid,x:px,y:py,w,h:+o.h||Math.round(w*0.66)};
        items.push(it);
        if(key)anchor.set(key,{itemId:it.id,rid:null});
        if(!hasXY)cursorY+=it.h+80;
      }else{
        warn.push(`第 ${k+1} 个对象的 type "${o.type}" 无法识别`);
      }
    }
    // ---- 连线 ----
    const resolve=ref=>{
      if(ref==null)return null;
      const key=String(ref).trim();
      if(anchor.has(key))return anchor.get(key);
      const hash=/^(.+)#(\d+)$/.exec(key);
      if(hash&&anchor.has(hash[1])){
        const base=anchor.get(hash[1]);
        const host=items.find(z=>z.id===base.itemId);
        if(host&&host.t==="todo"&&host.rows[+hash[2]-1])
          return {itemId:host.id,rid:host.rows[+hash[2]-1].id};
      }
      if(nodeByText.has(key))return {itemId:nodeByText.get(key),rid:null};
      const slash=key.indexOf("/");
      if(slash>0){
        const tail=key.slice(slash+1);
        if(nodeByText.has(tail))return {itemId:nodeByText.get(tail),rid:null};
        if(textIndex.has(tail))return textIndex.get(tail);
      }
      if(textIndex.has(key))return textIndex.get(key);
      return null;
    };
    for(const l of (sh.links||sh.edges||[])){
      if(!l)continue;
      const A=resolve(l.from!=null?l.from:l.a),B=resolve(l.to!=null?l.to:l.b);
      if(!A||!B){warn.push(`连线 ${JSON.stringify(l.from||l.a)} → ${JSON.stringify(l.to||l.b)} 找不到对象`);continue;}
      const col=typeof l.color==="string"?(LINK_COLORS[l.color.toLowerCase()]||l.color):"#64748B";
      const e={id:uid("e"),a:A.itemId,b:B.itemId,color:/^#/.test(col)?col:"#64748B",label:String(l.label||l.text||"")};
      const stA=items.find(z=>z.id===A.itemId),stB=items.find(z=>z.id===B.itemId);
      const isFlow=(stA&&stA.t==="shape")||(stB&&stB.t==="shape");
      const styleTxt=String(l.style||l.shape||"");
      const self=A.itemId===B.itemId&&(A.rid||null)===(B.rid||null);
      const wantLoop=self||/^(loop|back|cycle|回环|循环|回退)$/i.test(styleTxt)
        ||(l.style==null&&stA&&stB&&stA.t==="shape"&&stB.t==="shape"&&isBackEdge(stA,stB));
      const wantOrtho=!wantLoop&&(/^(ortho|right|角|直角|straight)$/i.test(styleTxt)
        ||(l.style==null&&isFlow));
      if(wantLoop){e.st="loop";if(!l.color)e.color=isFlow?"#94A3B8":"#64748B";
        if(l.side==="left"||l.side==="up"||+l.side<0)e.side=-1;
        else if(l.side==="right"||l.side==="down"||+l.side>0)e.side=1;}
      if(wantOrtho){e.st="ortho";if(!l.color)e.color="#94A3B8";}
      if(l.dash===true||l.dashed===true)e.solid=0;else if(wantOrtho||wantLoop)e.solid=1;
      if(A.rid)e.ar=A.rid;
      if(B.rid)e.br=B.rid;
      edges.push(e);
    }
    return {name:String(sh.name||sh.title||`画布 ${si+1}`),camera:null,
            folder:sh.folder!=null?String(sh.folder):null,items,edges};
  });
  return {sheets,assets,warn};
}
function openProjectFile(f,mode){
  if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    let p;
    const raw=String(rd.result||"");
    if(/^\s*</.test(raw)){                   // 无界思维 .html：取出里面内嵌的工程
      const ex=fsExtract(raw);
      if(!ex||!ex.rec||ex.rec.bad||!ex.rec.project){toast("这个 HTML 里没有无界思维的工程数据");return;}
      p=ex.rec.project;
    }else{
      try{p=JSON.parse(raw);}
      catch(_){toast("无法解析该文件：不是 JSON 格式（请选择 .json 工程文件）");return;}
    }
    if(!p||typeof p!=="object"){toast("无法读取该文件：内容为空");return;}
    if(!Array.isArray(p.sheets)&&!Array.isArray(p.items)){
      toast("无法读取该文件：缺少画布数据（不是无界思维工程文件）");return;
    }
    const m=mode||openMode||"append";
    if(isSimpleFormat(p)){                     // 手写/AI 生成的简化格式
      try{
        const built=buildFromSimple(p);
        pushHistory();
        for(const k in built.assets)S.assets.set(k,built.assets[k]);
        const n=built.sheets.reduce((a,sh)=>a+sh.items.length,0);
        const fname=String(f.name||"").replace(/\.(json|html?)$/i,"").slice(0,24)||"导入的工程";
        if(m==="merge")mergeProject(built.sheets);
        else if(m==="replace"){
          SH.folders=[{id:uid("fd"),name:"我的项目"}];SH.curF=SH.folders[0].id;
          SH.list=built.sheets.map(sh=>{
            let f=SH.curF;
            if(sh.folder){
              const k=String(sh.folder).slice(0,24);
              let ex=SH.folders.find(x=>x.name===k);
              if(!ex){ex={id:uid("fd"),name:k};SH.folders.push(ex);}
              f=ex.id;
            }
            return {id:uid("sh"),name:sh.name,fid:f,camera:null,data:{items:sh.items,edges:sh.edges}};
          });
          SH.cur=0;SH.curF=SH.list[0].fid;ensureFolders();applySheet(SH.list[0]);renderSheetbar();
        }else appendProject(built.sheets,projectIsEmpty(),m==="folder"?fname:null);
        pushHistory();fitView(built.sheets.length===1?true:false);
        toast(built.warn.length
          ? `已导入 ${n} 个对象 · ${built.warn.length} 处未能识别（详见控制台）`
          : `已导入简化格式：${built.sheets.length} 个画布 / ${n} 个对象`);
        if(built.warn.length)console.warn("[无界思维] 简化格式提示：\n"+built.warn.join("\n"));
      }catch(err){
        toast("简化格式解析失败："+(err&&err.message?err.message:"结构异常"));
      }
      return;
    }
    try{
      pushHistory();
      if(m==="replace"){
        loadProject(p);
        pushHistory();
        toast(`已替换为工程：${f.name} · 共 ${SH.list.length} 个画布（⌘/Ctrl+Z 可撤销）`);
        return;
      }
      const sheets=projSheets(p);
      const wasEmpty=projectIsEmpty();
      const na=remapImported(sheets,p.assets);
      for(const k in na)S.assets.set(k,na[k]);
      const n=sheets.reduce((a,sh)=>a+sh.items.length,0);
      if(m==="merge"){
        mergeProject(sheets);
        pushHistory();
        fitView();
        toast(`已合并到当前画布：${n} 个对象（原有内容保留）`);
      }else{
        const fname=String(f.name||"").replace(/\.(json|html?)$/i,"").slice(0,24)||"导入的工程";
        appendProject(sheets,wasEmpty,m==="folder"?fname:null);
        pushHistory();
        fitView(false);
        toast(wasEmpty
          ? `已打开工程：${f.name} · 共 ${sheets.length} 个画布`
          : m==="folder"
            ? `已收进新文件夹「${folderOf(SH.curF).name}」· ${sheets.length} 个画布（${n} 个对象）`
            : `已追加 ${sheets.length} 个画布（${n} 个对象）· 原有内容保留`);
      }
    }catch(err){
      toast("打开失败："+(err&&err.message?err.message:"文件结构异常"));
    }
  };
  rd.onerror=()=>toast("读取文件失败，请重试");
  rd.readAsText(f);
}
function projectIsEmpty(){
  if(IT.size)return false;
  return !SH.list.some((sh,i)=>i!==SH.cur&&sh.data&&sh.data.items&&sh.data.items.length);
}

});

(async function boot(){
  let restored=false,saved=null;
  const okP=p=>!!p&&(Array.isArray(p.sheets)||Array.isArray(p.items));
  try{
    AS.db=await idbOpen();
    AS.ok=true;
    saved=await idbGet(AS.db,AS.key);
    if(!okP(saved))saved=null;
  }catch(_){AS.ok=false;saved=null;}
  const emb=FS.kind==="local"?fsEmbedded():null;     // 本文件里内嵌的工程 = 文件里的最新版本
  if(emb&&okP(emb.project)){
    FS.base=emb.savedAt||0;
    let use=emb.project,msg="";
    if(saved&&fsSig(saved)===fsSig(emb.project))use=saved;          // 同一份内容：沿用本机的视角 / 当前画布
    else if(saved&&saved._dirty){                                     // 本机有没来得及写进文件的修改
      if(saved._base===FS.base){use=saved;msg="已恢复本机上次没写进文件的修改";}
      else{
        const takeFile=confirm(
          `本机有一份没写进文件的修改（${fsTime(saved._ts)}），但文件已在别处更新（${emb.device||"其他设备"} · ${fsTime(emb.savedAt)}）。\n\n`+
          `确定 = 用文件里的新版本（本机这份另存为 .json 下载）\n取消 = 继续用本机这份修改`);
        if(takeFile)fsBackup(saved,"本机未保存副本");
        else{use=saved;msg="已恢复本机的修改 · 保存后会覆盖文件里的版本";}
      }
    }
    try{
      loadProject(use);restored=true;
      FS.savedSig=use===emb.project?fsSig(serializeProject()):fsSig(emb.project);
      if(msg)setTimeout(()=>toast(msg),400);
    }catch(err){console.error("[无界思维] 载入内嵌工程失败",err);}
  }else if(saved){
    try{
      loadProject(saved);
      restored=true;
      if(FS.kind==="drive"){        // 网页版：先显示本机缓存，连上 Drive 后再和文件比对
        FS.base=saved._base||0;
        FS.savedSig=saved._dirty?"":fsSig(serializeProject());
      }else if(IT.size||SH.list.length>1)setTimeout(()=>toast("已恢复上次编辑的内容 · 新建画布/载入示例在 导出 菜单里"),400);
    }catch(_){}
  }
  if(!restored){
    if(FS.kind==="drive"&&DRV.target){   // 要打开 Drive 文件：先放空白画布，不载入示例
      render(true);fitView(false);renderSheetbar();
    }else{
      SH.list[0].name="ArmPick 示例";
      seedScene();
      render(true);
      fitView(false);
      renderSheetbar();
      setTimeout(()=>toast("已载入示例 · 滚轮平移画布，Ctrl/⌘+滚轮缩放，Z 开启放大镜"),400);
    }
    FS.savedSig=fsSig(serializeProject());
  }
  markSaved();updateUndoBtns();
  FS.dirty=fsSig(serializeProject())!==FS.savedSig;
  fsUI();
  fsInit();
})();
